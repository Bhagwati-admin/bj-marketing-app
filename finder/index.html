<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b1e3c">
  <title>Bhagwati Jewels — Lead Finder</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://njikksnabvdmzynepdgw.supabase.co/storage/v1/object/public/web/finder-icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lead Finder">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    /* Lead Finder additions (matches main app design language) */
    .lf-searchbar { display: flex; gap: 8px; margin-bottom: 10px; }
    .lf-add { flex: 0 0 auto; width: 46px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 22px; color: var(--maroon); cursor: pointer; box-shadow: var(--shadow); }
    .lf-searchbar input { flex: 1; border: 1.5px solid var(--line); border-radius: 999px; padding: 12px 18px; font-size: 16px; outline: none; background: #fff; box-shadow: var(--shadow); min-width: 0; }
    .lf-searchbar input:focus { border-color: var(--maroon); }
    .lf-controls { display: flex; gap: 8px; margin-bottom: 12px; }
    .lf-controls select { border: 1.5px solid var(--line); border-radius: 11px; padding: 9px 10px; background: #fff; font-size: 14px; }
    .lf-controls .btn { flex: 0 0 auto; }
    .lf-count { font-size: 13.5px; color: var(--muted); margin: 2px 2px 10px; }
    .lf-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 15px; margin-bottom: 11px; cursor: pointer; }
    .lf-card:active { background: #fdfaf6; }
    .lf-name { font-weight: 700; font-size: 16px; }
    .lf-addr { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
    .lf-chiprow { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
    .chip-pending { background: #fcefd2; color: #92600a; }
    .chip-approved { background: #e3f2e7; color: #16663c; }
    .chip-rejected { background: #fbe1df; color: #a12b24; }
    .chip-src { background: #eee9f2; color: #5b4a6b; }
    .lf-contacts { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
    .lf-cbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: #fff;
      border-radius: 999px; padding: 8px 13px; font-size: 13.5px; font-weight: 650; color: var(--maroon); text-decoration: none; }
    .lf-cbtn:active { background: var(--maroon-soft); }
    .lf-actions { display: flex; gap: 8px; margin-top: 11px; }
    .lf-actions .btn { flex: 1; }
    .btn-approve { background: #e3f2e7; color: #16663c; }
    .btn-reject { background: #fbe1df; color: #a12b24; }
    .btn-research { background: #ede7f6; color: #4a3a7a; }
    .lf-reset { background: none; border: 0; color: var(--muted); font-size: 12.5px; margin-top: 8px; cursor: pointer; padding: 4px 2px; text-decoration: underline; }
    #lf-map { height: 62vh; border-radius: var(--radius); box-shadow: var(--shadow); display: none; }
    .lf-viewtabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .lf-viewtabs button { flex: 1; border: 1.5px solid var(--line); background: #fff; border-radius: 11px; padding: 9px; font-size: 14px; font-weight: 650; color: #5d5765; cursor: pointer; }
    .lf-viewtabs button.on { background: var(--maroon); border-color: var(--maroon); color: #fff; }
    .lf-home-stats { display: flex; gap: 10px; margin-bottom: 14px; }
    .lf-pipe { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 15px; margin-bottom: 14px; }
    .lf-pipe h4 { margin: 0 0 9px; font-size: 14px; }
    .lf-bar { height: 10px; background: #f0e9dc; border-radius: 999px; overflow: hidden; }
    .lf-bar-fill { height: 100%; background: linear-gradient(90deg, var(--maroon), #c9a14a); border-radius: 999px; transition: width .4s; }
    .lf-pipe .nums { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
    .lf-res { margin-top: 12px; }
    .lf-res .res-sum { margin: 0 0 10px; font-size: 14.5px; line-height: 1.5; }
    .lf-res .res-sec { border-left: 3px solid var(--line); padding: 0 0 0 11px; margin-bottom: 11px; }
    .lf-res .res-sec.good { border-left-color: #1a7f4e; }
    .lf-res .res-sec.gap { border-left-color: #c9922a; }
    .lf-res .res-sec.pitch { border-left-color: var(--maroon); background: var(--maroon-soft); border-radius: 0 10px 10px 0; padding: 9px 12px; }
    .lf-res h5 { margin: 0 0 3px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .lf-res .res-sec.pitch h5 { color: var(--maroon); }
    .lf-res .res-sec p { margin: 0; font-size: 13.8px; line-height: 1.5; }
    .lf-res details { margin-top: 4px; }
    .lf-res summary { font-size: 12.5px; color: var(--muted); cursor: pointer; }
    .lf-res .ev { margin: 7px 0 0; padding-left: 17px; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
    .lf-draft textarea { width: 100%; min-height: 168px; border: 1.5px solid var(--line); border-radius: 12px;
      padding: 12px 13px; font-size: 15px; line-height: 1.5; resize: vertical; background: #fff; outline: none; font-family: inherit; }
    .lf-draft textarea:focus { border-color: var(--maroon); }
    .lf-draft .why { font-size: 12px; color: var(--muted); margin: 8px 2px 0; line-height: 1.5; }
    .lf-draft .send { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .lf-draft .send a, .lf-draft .send button { flex: 1; min-width: 104px; text-align: center; border: 1.5px solid var(--line);
      background: #fff; border-radius: 999px; padding: 11px 12px; font-size: 14px; font-weight: 650; color: var(--maroon);
      text-decoration: none; cursor: pointer; }
    .lf-draft .send a:active, .lf-draft .send button:active { background: var(--maroon-soft); }
    .lf-searchbar .combo { flex: 1; min-width: 0; }
    .lf-searchbar .combo input { width: 100%; }
    .lf-combo-count { float: right; color: var(--muted); font-size: 13px; font-weight: 600; }
    .lf-arearow { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px;
      box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
    .lf-arearow:active { background: #fdfaf6; }
    .lf-arearow .ar-main { flex: 1; min-width: 0; }
    .lf-arearow .ar-city { font-weight: 650; font-size: 15px; }
    .lf-arearow .ar-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .lf-arearow .ar-num { font-size: 20px; font-weight: 800; color: var(--maroon); line-height: 1; text-align: right; }
    .lf-arearow .ar-num span { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: .3px; }
    .lf-morebtn { background: none; border: 0; color: var(--maroon); font-weight: 650; font-size: 13.5px;
      padding: 8px 2px; cursor: pointer; text-decoration: underline; }
    .btn-draft { background: var(--gold-soft); color: #7a5a12; }
    .chip-res { background: #e3f2e7; color: #16663c; }
    .chip-p5 { background: #f6e7c4; color: #7a5410; }
    .lf-pipe .hint { font-size: 12px; color: var(--muted); margin-top: 7px; line-height: 1.45; }
    .lf-signout { background: none; border: 0; color: rgba(255,255,255,.85); font-size: 12.5px; cursor: pointer; padding: 6px 0 6px 10px; }
    .leaflet-container { font: inherit; }
  </style>
</head>
<body>
  <div id="app">
    <div class="splash">
      <div class="logo-badge">BJ</div>
      <p>Bhagwati Jewels · Lead Finder</p>
    </div>
  </div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../config.js"></script>
  <script>
  'use strict';
  const sb = window.supabase.createClient(BJ_CONFIG.SUPABASE_URL, BJ_CONFIG.SUPABASE_KEY);
  const $app = document.getElementById('app');
  const S = {
    user: null,
    results: [],
    filter: 'all',        // all | pending | approved | rejected
    view: 'list',         // list | map
    state: '',            // chosen state filter
    buf: '10',            // chosen buffer km
    areaLabel: '',
    lastQueryDesc: '',
    map: null, markers: [],
    homeCounts: null,
    rejectTarget: null,
    areas: [], sug: [], areaView: [], areaAll: false, screen: 'home',
  };
  const REJECT_REASONS = ['Natural only', 'Gold with CZ / moissanite only', 'Silver / fashion only', 'Indian vendor / supplier', 'Pawn shop', 'Chain store', 'Repair / watch only', 'Closed', 'Not a jeweller', 'Other'];
  // Derived from whatever is actually in the database (see loadAreas), so loading a new
  // state needs no code change. The literals are only a fallback for a cold/failed load.
  let STATES = ['FL', 'NY', 'NJ'];

  /* ---------- utils ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function toast(msg, cls) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show' + (cls ? ' ' + cls : '');
    clearTimeout(toast._h); toast._h = setTimeout(() => { t.className = ''; }, 2600);
  }
  function digitsOnly(p) { return (p || '').replace(/[^0-9+]/g, ''); }
  function waLink(p) {
    let d = digitsOnly(p).replace(/^\+/, '');
    if (!d) return null;
    if (d.length === 10) d = '1' + d;           // US default
    return 'https://wa.me/' + d;
  }
  function smsLink(p) {
    let d = digitsOnly(p).replace(/^\+/, '');
    if (!d) return null;
    if (d.length === 10) d = '1' + d;           // US default
    return 'sms:+' + d;
  }
  function igLink(v) {
    if (!v) return null;
    if (/^https?:/i.test(v)) return v;
    return 'https://www.instagram.com/' + v.replace(/^@/, '');
  }
  function fbLink(v) {
    if (!v) return null;
    if (/^https?:/i.test(v)) return v;
    return 'https://www.facebook.com/' + v;
  }
  function webLink(v) {
    if (!v) return null;
    return /^https?:/i.test(v) ? v : 'https://' + v;
  }
  /* Google Maps links. The /maps/search/<name>/@lat,lng form looks right but runs a
     TEXT SEARCH anchored at those coordinates — so a generic name like "ABC Jewelry"
     lands on a list of candidates instead of the shop. Verified in the browser.
     A full street address as the query opens the business card directly (name, hours,
     reviews, Directions), and falls back to the address itself if Google does not know
     the business. Bare coordinates are correct but nameless, so they are the middle
     option: used only when there is no usable address. */
  function mapsLink(p) {
    const base = 'https://www.google.com/maps/search/?api=1&query=';
    if (p.address && p.city && p.region) {
      const state = p.region + (p.postcode ? ' ' + p.postcode : '');
      return base + encodeURIComponent([p.name, p.address, p.city, state].filter(Boolean).join(', '));
    }
    if (p.latitude != null && p.longitude != null) return base + p.latitude + ',' + p.longitude;
    return base + encodeURIComponent([p.name, p.city, p.region, 'USA'].filter(Boolean).join(', '));
  }
  function statusOf(p) { return p.approved === true ? 'approved' : p.approved === false ? 'rejected' : 'pending'; }
  function relTime(ts) {
    if (!ts) return null;
    const s = (Date.now() - new Date(ts).getTime()) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' days ago';
  }

  const PRIO_LABEL = { 5: 'Sells lab-grown', 4: 'Bridal / custom focus', 3: 'Solid independent', 2: 'Needs verifying', 1: 'Weak fit' };
  function researchHtml(p) {
    const reasons = Array.isArray(p.verdict_reasons) ? p.verdict_reasons : [];
    const narrative = p.summary || p.good_at || p.struggling_with || p.pitch_angle;
    // A rule-based reject has a reason but no write-up. It must still say WHY,
    // otherwise the card reads as a verdict with nothing behind it.
    if (!narrative && !reasons.length) return '';
    const sec = (cls, label, val) => val
      ? `<div class="res-sec ${cls}"><h5>${label}</h5><p>${esc(val)}</p></div>` : '';
    const li = reasons.map(r =>
      `<li>${esc(r.signal || '')}${r.src ? ' <i>— ' + esc(r.src) + '</i>' : ''}</li>`).join('');
    let ev = '';
    if (reasons.length) {
      ev = narrative
        ? `<details><summary>Evidence (${reasons.length})</summary><ul class="ev">${li}</ul></details>`
        : `<div class="res-sec ${p.verdict === 'not_fit' ? 'gap' : 'good'}">
             <h5>${p.verdict === 'not_fit' ? 'Why this was ruled out' : 'What we found'}</h5>
             <ul class="ev" style="margin-top:2px">${li}</ul></div>`;
    }
    return `<div class="lf-res">
      ${p.summary ? `<p class="res-sum">${esc(p.summary)}</p>` : ''}
      ${sec('good', '💪 What they’re good at', p.good_at)}
      ${sec('gap', '⚠️ Where they struggle', p.struggling_with)}
      ${sec('pitch', '🎯 How we pitch them', p.pitch_angle)}
      ${ev}
    </div>`;
  }

  /* ---------- approach drafts (M3) ----------
     Short opener whose only job is to get 15 minutes. Never auto-sends: Ravi copies it
     or it opens WhatsApp/SMS pre-filled and he presses send himself. A store-specific
     message written during research (approach_msg) always beats this template. */
  const REGION_NAME = { FL: 'Florida', NY: 'New York', NJ: 'New Jersey', TX: 'Texas' };
  const OUTREACH = {
    signoff: 'Ravi\nBhagwati Jewels',
    place(p) { return p.city || REGION_NAME[p.region] || p.region || 'your area'; },
    hook(p) {
      const seg = (p.segment || '').toLowerCase();
      if (p.priority >= 5)
        return 'I saw you already carry lab-grown — that is exactly what we make, so you would be buying straight from the factory.';
      if (seg === 'wholesaler')
        return 'We supply wholesalers direct at manufacturer prices, with credit terms and memo available.';
      if (seg === 'exchange')
        return 'We supply the independent dealers in exchanges like yours — certified lab-grown, ready stock or made to order.';
      return 'We supply independent jewellers with certified lab-grown pieces — ready stock, or made to order in 4 to 10 days.';
    },
    compose(p, dateStr) {
      if (p.approach_msg) return OUTREACH.fill(p.approach_msg, p, dateStr);
      const where = OUTREACH.place(p);
      const when = dateStr || '{date}';
      return OUTREACH.fill(
        `Hello — Ravi here from Bhagwati Jewels. We manufacture lab-grown diamond jewellery in India and hold stock in our New York office.\n\n` +
        `{hook}\n\n` +
        `I am in ${where} on ${when} and would like 15 minutes to show you a few pieces — IGI certified, overnight from New York, memo available.\n\n` +
        `Would that suit you?\n\n${OUTREACH.signoff}`, p, dateStr);
    },
    fill(t, p, dateStr) {
      return String(t)
        .replace(/\{hook\}/g, OUTREACH.hook(p))
        .replace(/\{store\}/g, p.name || '')
        .replace(/\{city\}/g, OUTREACH.place(p))
        .replace(/\{date\}/g, dateStr || '{date}');
    }
  };
  function openDraft(id) {
    const p = findP(id); if (!p) return;
    const text = OUTREACH.compose(p, null);
    const why = p.approach_msg
      ? 'Written for this store during research.'
      : (p.good_at ? 'Built from the template. What they are good at: ' + esc(p.good_at.split('. ')[0]) + '.'
                   : 'Built from the template — this store has not been deep-researched yet.');
    document.getElementById('draft-modal').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeDraft()">
        <div class="modal lf-draft" style="max-height:88vh;overflow-y:auto">
          <h3 style="margin-bottom:2px">Message ${esc(p.name)}</h3>
          <p style="margin:4px 0 12px">Edit it however you like — nothing sends until you press send yourself.</p>
          <textarea id="dr-text">${esc(text)}</textarea>
          <div class="why">${why}${text.indexOf('{date}') > -1 ? '<br><b>Put the date in</b> where it says {date} — or open this store from a trip day and the date fills itself.' : ''}</div>
          <div class="send">
            <button onclick="copyDraft()">📋 Copy</button>
            ${waLink(p.phone) ? `<a href="#" onclick="return openWa('${p.id}')">🟢 WhatsApp</a>` : ''}
            ${smsLink(p.phone) ? `<a href="#" onclick="return openSms('${p.id}')">💬 SMS</a>` : ''}
            ${p.email ? `<a href="#" onclick="return openMail('${p.id}')">✉️ Email</a>` : ''}
          </div>
          <div class="modal-actions" style="margin-top:14px"><button class="btn btn-secondary" onclick="closeDraft()">Close</button></div>
        </div>
      </div>`;
  }
  function closeDraft() { const el = document.getElementById('draft-modal'); if (el) el.innerHTML = ''; }
  function draftText() { const el = document.getElementById('dr-text'); return el ? el.value : ''; }
  function copyDraft() {
    const t = draftText();
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Copied ✓', 'ok'), () => toast('Could not copy', 'err'));
    else toast('Copy not supported here', 'err');
  }
  function openWa(id) {
    const p = findP(id); if (!p) return false;
    const w = waLink(p.phone); if (!w) return false;
    window.open(w + '?text=' + encodeURIComponent(draftText()), '_blank', 'noopener');
    return false;
  }
  function openSms(id) {
    const p = findP(id); if (!p) return false;
    const sm = smsLink(p.phone); if (!sm) return false;
    window.location.href = sm + '?body=' + encodeURIComponent(draftText());
    return false;
  }
  function openMail(id) {
    const p = findP(id); if (!p) return false;
    if (!p.email) return false;
    window.location.href = 'mailto:' + encodeURIComponent(p.email)
      + '?subject=' + encodeURIComponent('Lab-grown diamond jewellery — Bhagwati Jewels')
      + '&body=' + encodeURIComponent(draftText());
    return false;
  }

  /* ---------- area picker ----------
     Ravi does not know Florida geography, so the app has to offer the areas rather than
     expect him to type one. `area` on lf_places is a derived grouping (city when known,
     otherwise the nearest known city centre within 30 km of the pin) — browsing only,
     never an address. */
  async function loadAreas() {
    try {
      const { data } = await sb.from('lf_areas').select('*').order('total', { ascending: false }).limit(3000);
      S.areas = data || [];
      const found = [...new Set(S.areas.map(a => a.region).filter(Boolean))].sort();
      if (found.length) STATES = found;
    } catch (e) { S.areas = []; }
  }
  function areaSub(a) {
    const bits = [];
    if (a.to_review) bits.push(a.to_review + ' to review');
    if (a.approved) bits.push(a.approved + ' approved');
    if (a.lgd) bits.push('⭐ ' + a.lgd + ' lab-grown');
    if (!bits.length) bits.push(a.fits ? a.fits + ' worth a look' : 'not screened yet');
    return bits.join(' · ');
  }
  function areaSuggest(v) {
    const box = document.getElementById('lf-areadrop'); if (!box) return;
    const t = (v || '').trim().toLowerCase();
    if (!t) { closeSug(); return; }
    let list = S.areas.filter(a => !S.state || a.region === S.state);
    const starts = list.filter(a => a.city.toLowerCase().startsWith(t));
    const has = list.filter(a => !a.city.toLowerCase().startsWith(t) && a.city.toLowerCase().includes(t));
    S.sug = starts.concat(has).slice(0, 8);
    if (!S.sug.length) { closeSug(); return; }
    box.innerHTML = S.sug.map((a, i) =>
      `<button type="button" onmousedown="pickSug(${i})">${esc(a.city)} <span class="lf-combo-count">${a.total}</span></button>`
    ).join('');
    box.className = 'combo-list open';
  }
  function closeSug() { const box = document.getElementById('lf-areadrop'); if (box) { box.className = 'combo-list'; box.innerHTML = ''; } }
  function pickSug(i) { const a = S.sug[i]; if (a) goArea(a); }
  function pickAreaRow(i) { const a = S.areaView[i]; if (a) goArea(a); }
  function goArea(a) {
    closeSug();
    S.state = a.region;
    const q = document.getElementById('lf-q'); if (q) q.value = a.city;
    const sel = document.getElementById('lf-state'); if (sel) sel.value = a.region;
    doSearch();
  }
  function toggleAllAreas() { S.areaAll = !S.areaAll; renderHome(); }
  function onStateChange(v) {
    S.state = v; S.areaAll = false; closeSug();
    if (S.screen === 'home') renderHome();
  }
  function areasHtml() {
    if (!S.areas.length) return '';
    S.areaView = S.areas.filter(a => !S.state || a.region === S.state);
    if (!S.areaView.length) return '';
    const limit = S.areaAll ? S.areaView.length : 10;
    const rows = S.areaView.slice(0, limit).map((a, i) =>
      `<div class="lf-arearow" onclick="pickAreaRow(${i})">
         <div class="ar-main">
           <div class="ar-city">${esc(a.city)}${S.state ? '' : ' <span style="color:var(--muted);font-weight:600">· ' + esc(a.region) + '</span>'}</div>
           <div class="ar-sub">${areaSub(a)}</div>
         </div>
         <div class="ar-num">${a.total}<span>JEWELLERS</span></div>
       </div>`).join('');
    const more = S.areaView.length > 10
      ? `<button class="lf-morebtn" onclick="toggleAllAreas()">${S.areaAll ? 'Show fewer' : 'Show all ' + S.areaView.length + ' areas'}</button>`
      : '';
    return `<div class="section-label">Areas with the most jewellers${S.state ? ' — ' + esc(S.state) : ''}</div>
      <p style="font-size:12.5px;color:var(--muted);margin:0 2px 10px">Tap an area to see its jewellers. Grouped by the nearest town, so a tap covers the surrounding shops too.</p>
      ${rows}${more}`;
  }

  /* ---------- shell ---------- */
  function shell(inner, opts) {
    opts = opts || {};
    return `

  /* ---------- search ---------- */
  async function geocode(q, state) {
    const query = q + (state ? ', ' + state : '') + ', USA';
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=' + encodeURIComponent(query);
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j.length) return null;
    return j[0]; // has boundingbox [s, n, w, e] and display_name
  }
  async function doSearch() {
    const q = document.getElementById('lf-q').value.trim();
    S.state = document.getElementById('lf-state') ? document.getElementById('lf-state').value : S.state;
    S.buf = document.getElementById('lf-buf') ? document.getElementById('lf-buf').value : S.buf;
    const state = S.state;
    const bufKm = parseFloat(S.buf) || 0;
    if (!q) { toast('Type a city or area name', 'err'); return; }
    toast('Searching…');
    let rows = null, label = q;
    try {
      const g = await geocode(q, state);
      if (g && g.boundingbox) {
        let s = parseFloat(g.boundingbox[0]), n = parseFloat(g.boundingbox[1]),
            w = parseFloat(g.boundingbox[2]), e = parseFloat(g.boundingbox[3]);
        const dLat = bufKm / 111;
        const midLat = (s + n) / 2;
        const dLon = bufKm / (111 * Math.max(0.3, Math.cos(midLat * Math.PI / 180)));
        s -= dLat; n += dLat; w -= dLon; e += dLon;
        let qy = sb.from('lf_places').select('*')
          .eq('hidden', false)
          .gte('latitude', s).lte('latitude', n)
          .gte('longitude', w).lte('longitude', e)
          .order('name').limit(1000);
        if (state) qy = qy.eq('region', state);
        const { data, error } = await qy;
        if (error) throw error;
        rows = data || [];
        label = (g.display_name || q).split(',').slice(0, 2).join(',');
      }
    } catch (e) { /* fall through to text search */ }
    if (rows === null || rows.length === 0) {
      const qq = q.replace(/[,()%.]/g, ' ').replace(/\s+/g, ' ').trim();
      let qy = sb.from('lf_places').select('*')
        .eq('hidden', false)
        .or(`city.ilike.%${qq}%,name.ilike.%${qq}%,address.ilike.%${qq}%,area.ilike.%${qq}%`)
        .order('name').limit(1000);
      if (state) qy = qy.eq('region', state);
      const { data, error } = await qy;
      if (error) { toast(error.message, 'err'); return; }
      if (rows === null || (data && data.length > rows.length)) rows = data || [];
    }
    S.results = rows; S.areaLabel = label; S.view = 'list';
    S.filter = rows.some(r => r.approved == null) ? 'pending' : 'all';
    renderResults();
  }

  /* ---------- results ---------- */
  function filtered() {
    if (S.filter === 'all') return S.results;
    if (S.filter === 'research') return S.results.filter(p => p.research && statusOf(p) === 'pending');
    return S.results.filter(p => statusOf(p) === S.filter);
  }
  function chipCounts() {
    const c = { all: S.results.length, pending: 0, approved: 0, rejected: 0, research: 0 };
    for (const p of S.results) { c[statusOf(p)]++; if (p.research && statusOf(p) === 'pending') c.research++; }
    return c;
  }
  function card(p) {
    const st = statusOf(p);
    const chips = [
      st === 'pending' ? '<span class="chip chip-pending">To review</span>' :
      st === 'approved' ? '<span class="chip chip-approved">Approved ✓</span>' :

    if (p.locations_count && p.locations_count > 1) chips.push(`<span class="chip chip-src">🏢 ${p.locations_count} locations — main branch</span>`);
    if (p.segment === 'exchange') chips.push('<span class="chip chip-src">🏬 Multi-vendor exchange</span>');
    if (p.pitch_angle) chips.push('<span class="chip chip-res">Researched ✓</span>');
    else if (p.research && st === 'pending') chips.push('<span class="chip chip-pending">🔍 Research listed</span>');
    if (p.priority) chips.push(`<span class="chip ${p.priority >= 5 ? 'chip-p5' : 'chip-src'}">${p.priority >= 5 ? '⭐ ' : ''}P${p.priority} · ${esc(PRIO_LABEL[p.priority] || '')}</span>`);
    if (p.source && p.source !== 'osm') chips.push(`<span class="chip chip-src">${esc(p.source)}</span>`);
    const addr = [p.address, p.city, p.postcode].filter(Boolean).join(', ');
    const c = contactBtns(p);
    const actions = st === 'pending'
      ? `<div class="lf-actions">
           <button class="btn btn-small btn-approve" onclick="event.stopPropagation();approve('${p.id}')">✓ Approve</button>

      : `<button class="lf-reset" onclick="event.stopPropagation();resetVerdict('${p.id}')">Undo — back to review</button>`;
    return `<div class="lf-card" id="card-${p.id}" onclick="openDetail('${p.id}')">

  function contactBtns(p, full) {
    const c = [];

    if (p.phone) c.push(`<a class="lf-cbtn" ${sp} href="tel:${esc(digitsOnly(p.phone))}">📞 Call</a>`);
    const sms = smsLink(p.phone); if (sms) c.push(`<a class="lf-cbtn" ${sp} href="${esc(sms)}">💬 SMS</a>`);
    if (full) { const wa = waLink(p.phone); if (wa) c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="${esc(wa)}">🟢 WhatsApp</a>`); }
    if (p.email) c.push(`<a class="lf-cbtn" ${sp} href="mailto:${esc(p.email)}">✉️ Email</a>`);
    const wl = webLink(p.website); if (wl) c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="${esc(wl)}">🌐 Website</a>`);
    const ig = igLink(p.instagram); if (ig) c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="${esc(ig)}">📸 Instagram</a>`);
    const fb = fbLink(p.facebook); if (fb) c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="${esc(fb)}">📘 Facebook</a>`);
    c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="${esc(mapsLink(p))}">🗺️ Map</a>`);
    // Exact-coordinates fallback. "Map" searches by name and address, which opens the
    // business card when Google knows the shop — but some shops publish no address at
    // all (delivery-only, home studios), and then the search drifts. Pin never drifts.
    if (p.latitude != null && p.longitude != null)
      c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${p.latitude},${p.longitude}">📍 Pin</a>`);
    return c;

  function openDetail(id) {

  function mountMap() {

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(S.map);
    const pts = [];
    for (const p of filtered()) {
      if (p.latitude == null || p.longitude == null) continue;
      const st = statusOf(p);
      const color = st === 'approved' ? '#1a7f4e' : st === 'rejected' ? '#b3372f' : '#7b1e3c';
      const m = L.circleMarker([p.latitude, p.longitude], { radius: 8, color, fillColor: color, fillOpacity: .85, weight: 1.5 }).addTo(S.map);
      m.bindPopup(`<b>${esc(p.name)}</b><br>${esc([p.address, p.city].filter(Boolean).join(', '))}<br><a href="#" onclick="jumpTo('${p.id}');return false;">Open card</a>`);
      pts.push([p.latitude, p.longitude]);

          </div>
          <div class="modal-actions">
            <button class="btn btn-secondary" onclick="openReject('${p.id}')">Back</button>
            <button class="btn btn-primary" onclick="saveOtherReason()">Reject</button>
          </div>
        </div>
      </div>`;
    setTimeout(() => { const el = document.getElementById('rj-other'); if (el) el.focus(); }, 60);
  }
  function saveOtherReason() {
    const el = document.getElementById('rj-other');
    const text = (el ? el.value : '').trim();
    if (!text) { toast('Type a short reason, or tap Back to pick one', 'err'); return; }
    applyReject(text.slice(0, 160));
  }
  async function applyReject(reason) {
    const id = S.rejectTarget; const p = findP(id); if (!p) return;
    const patch = { approved: false, verdict: 'not_fit', verdict_source: 'manual', verdict_reasons: [{ signal: reason, src: 'manual' }] };
    const { error } = await sb.from('lf_places').update(patch).eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    Object.assign(p, patch); closeReject(); toast('Rejected', 'ok'); renderResults();
  }
  function openAddLead() {
    const el = document.getElementById('addlead-modal'); if (!el) return;
    el.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeAddLead()">
        <div class="modal">
          <h3>Add a jeweller</h3>
          <p class="sub" style="margin-bottom:10px">Spotted one on Instagram or on the road? Add it — Claude researches it on the next run.</p>
          <div class="field"><label>Store name *</label><input id="al-name" type="text"></div>
          <div class="field"><label>Instagram handle</label><input id="al-ig" type="text" placeholder="e.g. boca_treasures" autocapitalize="none"></div>
          <div class="field"><label>City</label><input id="al-city" type="text"></div>
          <div class="field"><label>State</label><select id="al-state">${STATES.map(s=>`<option${(S.state||'FL')===s?' selected':''}>${s}</option>`).join('')}</select></div>
          <div class="field"><label>Phone (optional)</label><input id="al-phone" type="tel"></div>
          <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeAddLead()">Cancel</button>
            <button class="btn btn-primary" onclick="saveLead()">Add 🔍</button>
          </div>
        </div>
      </div>`;
  }
  function closeAddLead() { const el = document.getElementById('addlead-modal'); if (el) el.innerHTML = ''; }
  async function saveLead() {
    const name = document.getElementById('al-name').value.trim();
    if (!name) { toast('Store name is needed', 'err'); return; }
    const ig = document.getElementById('al-ig').value.trim().replace(/^@/, '');
    const city = document.getElementById('al-city').value.trim();
    const region = document.getElementById('al-state').value;
    const phone = document.getElementById('al-phone').value.trim();
    const row = { source: 'manual', source_id: 'manual-' + Date.now(), name,
      instagram: ig || null, city: city || null, area: city || null, region, phone: phone || null, research: true };
    const { data, error } = await sb.from('lf_places').insert(row).select().single();
    if (error) { toast(error.message, 'err'); return; }
    closeAddLead(); toast('Added — flagged for Claude research 🔍', 'ok');
    if (S.areaLabel && Array.isArray(S.results)) { S.results.unshift(data); renderResults(); }
  }
  async function markResearch(id) {
    const p = findP(id); if (!p) return;
    const val = !p.research;
    const { error } = await sb.from('lf_places').update({ research: val }).eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    p.research = val;
    toast(val ? 'Listed for Claude deep research 🔍' : 'Removed from research list');
    renderResults();
  }
  async function resetVerdict(id) {
    const p = findP(id); if (!p) return;
    const patch = { approved: null, verdict: null, verdict_source: null, verdict_reasons: null };
    const { error } = await sb.from('lf_places').update(patch).eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    Object.assign(p, patch); toast('Back to review'); renderResults();
  }

  /* ---------- boot ---------- */
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { renderLogin(); return; }
    S.user = session.user;
    const { data: prof, error } = await sb.from('profiles').select('role, active').eq('id', S.user.id).single();
    if (error || !prof || prof.role !== 'owner' || !prof.active) {
      $app.innerHTML = `<div class="auth-wrap"><div class="auth-card" style="text-align:center">
        <h2>Owner only</h2><p class="sub">The Lead Finder is currently available only to the owner account.</p>
        <button class="btn btn-secondary" onclick="doSignOut()">Sign out</button></div></div>`;
      return;
    }
    await loadAreas();          // sets STATES from the data
    await loadHomeCounts();     // per-state counts iterate STATES
    renderHome();
  }
  window.doLogin = doLogin; window.doSignOut = doSignOut; window.doSearch = doSearch;
  window.setFilter = setFilter; window.setView = setView; window.approve = approve;
  window.openReject = openReject; window.closeReject = closeReject; window.doReject = doReject;
  window.saveOtherReason = saveOtherReason;
  window.resetVerdict = resetVerdict; window.jumpTo = jumpTo; window.markResearch = markResearch;
  window.openDetail = openDetail; window.closeDetail = closeDetail;
  window.openDraft = openDraft; window.closeDraft = closeDraft; window.copyDraft = copyDraft;
  window.openWa = openWa; window.openSms = openSms; window.openMail = openMail;
  window.openAddLead = openAddLead; window.closeAddLead = closeAddLead; window.saveLead = saveLead;
  window.areaSuggest = areaSuggest; window.closeSug = closeSug; window.pickSug = pickSug;
  window.pickAreaRow = pickAreaRow; window.toggleAllAreas = toggleAllAreas; window.onStateChange = onStateChange;
  init();
  </script>
</body>
</html>
