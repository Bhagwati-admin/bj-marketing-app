body{background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;overflow-x:hidden}

.v-ico{flex:0 0 auto}

.v-sub-h{margin:14px 2px 8px}

.v-card h3,.v-h3{margin:0 0 4px;font-size:19px;line-height:1.2;color:var(--ink)}

.v-card.bad{background:var(--bad-soft);border-color:transparent;box-shadow:none}
.v-card.bad h3{color:var(--bad)}
.v-card.info{background:var(--info-soft);border-color:transparent;box-shadow:none}
.v-card.info h3{color:var(--info)}

.q.appt{border-color:var(--line-strong)}

.seq.done{background:var(--ok-soft);color:var(--ok)}
.v-act{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);font-weight:700;font-size:13.5px;text-decoration:none;cursor:pointer;white-space:nowrap;font-family:var(--body)}
.v-act.pri{background:var(--navy-soft);border-color:transparent;color:var(--navy)}

.v-link{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 6px;border:0;background:0 0;color:var(--navy);font-weight:700;font-size:14px;cursor:pointer;font-family:var(--body)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.02em;background:var(--surface);color:var(--ink-2);vertical-align:2px;white-space:nowrap;font-variant-numeric:tabular-nums}

.v-skel{height:66px;margin-bottom:8px;border-radius:14px}

.v-when .row{flex-basis:100%;margin-top:6px}

.v-opener[open] summary::after{content:"Hide"}

.field textarea{min-height:112px;resize:vertical;line-height:1.45}
