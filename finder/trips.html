<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b1e3c">
  <title>Bhagwati Jewels — Trip Planner</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://njikksnabvdmzynepdgw.supabase.co/storage/v1/object/public/web/finder-icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trips">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    .tp-signout { background: none; border: 0; color: rgba(255,255,255,.85); font-size: 12.5px; cursor: pointer; padding: 6px 0 6px 10px; }
    .tp-back { background: none; border: 0; color: #fff; font-size: 20px; padding: 4px 10px 4px 0; margin-left: -4px; cursor: pointer; }
    .tp-item { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 15px; margin-bottom: 11px; cursor: pointer; }
    .tp-item h4 { margin: 0 0 2px; font-size: 16px; }
    .tp-sub { font-size: 13px; color: var(--muted); }
    .tp-chiprow { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
    .chip-plan { background: #eee9f2; color: #5b4a6b; }
    .chip-ok { background: #e3f2e7; color: #16663c; }
    .chip-out { background: #fcefd2; color: #92600a; }
    .chip-no { background: #fbe1df; color: #a12b24; }
    .chip-warn { background: #fbe1df; color: #a12b24; }
    .tp-row2 { display: flex; gap: 10px; }
    .tp-row2 .field { flex: 1; }
    .tp-ends { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 15px; margin-bottom: 13px; }
    .tp-ends .lbl { font-size: 11.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
    .tp-endline { display: flex; align-items: center; gap: 9px; padding: 7px 0; }
    .tp-endline .pin { width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #fff; }
    .pin-s { background: var(--green); } .pin-e { background: var(--red); }
    .tp-endline .val { flex: 1; font-size: 14.5px; min-width: 0; }
    .tp-endline .val.empty { color: var(--muted); font-style: italic; }
    .tp-stop { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 9px; display: flex; gap: 12px; }
    .tp-stop.done { opacity: .68; }
    .tp-seq { width: 30px; height: 30px; border-radius: 50%; background: var(--maroon); color: #fff; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .tp-stop.met .tp-seq { background: var(--green); }
    .tp-stop.buyer_out .tp-seq { background: #b47814; }
    .tp-stop.not_interested .tp-seq, .tp-stop.skipped .tp-seq { background: #9a939f; }
    .tp-body { flex: 1; min-width: 0; }
    .tp-body .nm { font-weight: 700; font-size: 15.5px; }
    .tp-body .ad { font-size: 13px; color: var(--muted); margin-top: 1px; }
    .tp-leg { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); margin: 0 0 9px 15px; padding-left: 15px; border-left: 2px dashed var(--line); }
    .tp-mini { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
    .tp-mini a, .tp-mini button { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 650; color: var(--maroon); text-decoration: none; cursor: pointer; }
    .tp-out { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
    .tp-out button { border: 0; border-radius: 9px; padding: 7px 11px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
    .ob-met { background: #e3f2e7; color: #16663c; } .ob-out { background: #fcefd2; color: #92600a; }
    .ob-no { background: #fbe1df; color: #a12b24; } .ob-skip { background: #eee; color: #6b6570; }
    .ob-undo { background: none; color: var(--muted); text-decoration: underline; padding: 6px 2px; }
    .tp-sum { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 15px; margin-bottom: 13px; }
    .tp-sum .big { font-size: 15px; font-weight: 700; }
    .tp-sum .det { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .tp-warn { background: #fbe1df; color: #a12b24; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-top: 9px; font-weight: 600; }
    .tp-good { background: #e3f2e7; color: #16663c; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-top: 9px; font-weight: 600; }
    .pick-item { background: var(--card); border: 2px solid transparent; border-radius: 12px; box-shadow: var(--shadow); padding: 11px 13px; margin-bottom: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
    .pick-item.on { border-color: var(--maroon); background: var(--maroon-soft); }
    .pick-item.used { opacity: .5; }
    .pick-item .pk-main { flex: 1; min-width: 0; }
    .pick-item .pk-nm { font-weight: 650; font-size: 14.5px; }
    .pick-item .pk-sub { font-size: 12.5px; color: var(--muted); }
    .pick-item .pk-tick { font-size: 18px; color: var(--maroon); width: 20px; text-align: center; }
    .tp-sticky { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 72%, rgba(246,244,241,0)); padding: 14px 0 8px; }
    #tp-map { height: 46vh; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; }
    .rep-line { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
    .rep-line:last-child { border-bottom: 0; }
    .rep-line b { font-weight: 800; }
    .leaflet-container { font: inherit; }
    .ep-row { display: flex; gap: 8px; margin-bottom: 9px; }
    .ep-row input { flex: 1; min-width: 0; }
    .ep-loc { flex: 0 0 auto; border: 1.5px solid var(--line); background: #fff; border-radius: 11px;
      padding: 0 13px; font-size: 13.5px; font-weight: 650; color: var(--maroon); cursor: pointer; white-space: nowrap; }
    .ep-loc:disabled { opacity: .55; cursor: default; }
    .ep-sug { list-style: none; margin: 0 0 10px; padding: 0; max-height: 34vh; overflow-y: auto;
      border: 1.5px solid var(--line); border-radius: 12px; }
    .ep-sug li { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
    .ep-sug li:last-child { border-bottom: 0; }
    .ep-sug li:active, .ep-sug li.on { background: var(--maroon-soft); }
    .ep-sug .s-nm { font-weight: 650; font-size: 14.5px; }
    .ep-sug .s-ad { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
    .ep-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .ep-chips button { border: 1.5px solid var(--line); background: #fff; border-radius: 999px;
      padding: 6px 11px; font-size: 12.5px; color: var(--maroon); cursor: pointer; }
    #ep-map { height: 190px; border-radius: 12px; margin-bottom: 8px; display: none; }
    .ep-conf { background: #e3f2e7; color: #16663c; border-radius: 10px; padding: 9px 11px;
      font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .ep-hint { font-size: 12px; color: var(--muted); margin: 0 2px 10px; line-height: 1.5; }
    .tp-item { position: relative; }
    .tp-kebab { position: absolute; top: 8px; right: 6px; background: none; border: 0; font-size: 19px;
      color: var(--muted); padding: 4px 9px; cursor: pointer; line-height: 1; border-radius: 8px; }
    .tp-kebab:active { background: #f0ece5; }
    .tp-titlerow { display: flex; align-items: center; gap: 8px; }
    .tp-titlerow .grow { flex: 1; min-width: 0; }
    .tp-iconbtn { background: none; border: 1.5px solid var(--line); border-radius: 9px; padding: 6px 10px;
      font-size: 13px; color: var(--maroon); cursor: pointer; white-space: nowrap; }
    .tp-iconbtn.danger { color: #a12b24; border-color: #f0cfcc; }
    .sheet { position: fixed; inset: 0; background: rgba(20,14,24,.42); display: flex; align-items: flex-end;
      justify-content: center; z-index: 60; }
    .sheet-inner { background: var(--card); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0;
      padding: 8px 0 14px; box-shadow: 0 -6px 26px rgba(0,0,0,.2); }
    .sheet-inner h4 { margin: 10px 18px 6px; font-size: 15px; }
    .sheet-inner .sheet-sub { margin: 0 18px 10px; font-size: 12.5px; color: var(--muted); }
    .sheet-act { display: block; width: 100%; text-align: left; background: none; border: 0;
      padding: 14px 18px; font-size: 15.5px; color: var(--ink, #2a2430); cursor: pointer; }
    .sheet-act:active { background: #f6f2ec; }
    .sheet-act.danger { color: #a12b24; font-weight: 650; }
    .sheet-act.cancel { color: var(--muted); border-top: 1px solid var(--line); margin-top: 6px; }
    .warn-box { background: #fbe1df; color: #a12b24; border-radius: 10px; padding: 11px 13px;
      font-size: 13.2px; line-height: 1.5; margin: 0 0 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="app"><div class="splash"><div class="logo-badge">BJ</div><p>Bhagwati Jewels · Trips</p></div></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../config.js"></script>
  <script>
  'use strict';
  const sb = window.supabase.createClient(BJ_CONFIG.SUPABASE_URL, BJ_CONFIG.SUPABASE_KEY);
  const $app = document.getElementById('app');
  // Derived from whatever regions are actually in the database, so loading a new
  // state needs no code change here. The literals are only a cold-start fallback.
  let STATES = ['FL', 'NY', 'NJ'];
  const ROAD_FACTOR = 1.35;      // straight-line km -> road km
  const SPEED_KMH = 45;          // urban/suburban average
  const MAX_STOPS = 12, SOFT_STOPS = 8, MAX_HOURS = 9;
  const S = { user: null, view: 'trips', trips: [], trip: null, days: [], day: null,
              stops: [], places: {}, pick: null, map: null };

  /* ---------- utils ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function toast(msg, cls) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show' + (cls ? ' ' + cls : '');
    clearTimeout(toast._h); toast._h = setTimeout(() => { t.className = ''; }, 2600);
  }
  function digitsOnly(p) { return (p || '').replace(/[^0-9+]/g, ''); }
  function fmtDate(d) {
    if (!d) return '';
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function km(a, b) {
    if (!a || !b || a.lat == null || b.lat == null) return null;
    const R = 6371, rad = x => x * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const s = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function driveMin(d) { return d == null ? null : Math.round(d * ROAD_FACTOR / SPEED_KMH * 60); }
  function fmtLeg(d) {
    if (d == null) return 'distance unknown';
    const mi = d * 0.621371, m = driveMin(d);
    return `${mi < 10 ? mi.toFixed(1) : Math.round(mi)} mi · about ${m} min`;
  }
  function hrs(mins) {
    const h = Math.floor(mins / 60), m = Math.round(mins % 60);
    return h ? `${h}h ${m ? m + 'm' : ''}`.trim() : `${m}m`;
  }

  /* ---------- geometry: order a day ---------- */
  function pathCost(start, arr, end) {
    let c = 0, prev = start;
    for (const p of arr) { const d = km(prev, p); c += (d == null ? 25 : d); prev = p; }
    if (end) { const d = km(prev, end); c += (d == null ? 25 : d); }
    return c;
  }
  function orderStops(start, arr, end) {
    const pts = arr.filter(p => p.lat != null);
    const noGeo = arr.filter(p => p.lat == null);
    if (pts.length < 2) return pts.concat(noGeo);
    // nearest neighbour
    const left = pts.slice(), out = [];
    let cur = start || pts[0];
    while (left.length) {
      let bi = 0, bd = Infinity;
      left.forEach((p, i) => { const d = km(cur, p); if (d != null && d < bd) { bd = d; bi = i; } });
      cur = left[bi]; out.push(cur); left.splice(bi, 1);
    }
    // 2-opt
    let improved = true, guard = 0;
    while (improved && guard++ < 60) {
      improved = false;
      for (let i = 0; i < out.length - 1; i++) {
        for (let j = i + 1; j < out.length; j++) {
          const cand = out.slice(0, i).concat(out.slice(i, j + 1).reverse(), out.slice(j + 1));
          if (pathCost(start, cand, end) + 1e-9 < pathCost(start, out, end)) { out.splice(0, out.length, ...cand); improved = true; }
        }
      }
    }
    return out.concat(noGeo);
  }
  function dayMetrics(day, stops) {
    const start = day.start_lat != null ? { lat: day.start_lat, lng: day.start_lng } : null;
    const end = day.end_lat != null ? { lat: day.end_lat, lng: day.end_lng } : null;
    let drive = 0, dist = 0, unknown = 0, prev = start;
    for (const s of stops) {
      const pt = s._pt;
      const d = (prev && pt) ? km(prev, pt) : null;
      if (d == null) unknown++; else { dist += d; drive += driveMin(d); }
      if (pt) prev = pt;
    }
    if (end && prev) { const d = km(prev, end); if (d != null) { dist += d; drive += driveMin(d); } }
    const dwell = stops.length * (day.dwell_min || 45);
    return { drive, dwell, total: drive + dwell, dist, unknown, count: stops.length };
  }

  /* ---------- links ---------- */
  function navToPlace(p) {
    if (p.latitude != null && p.longitude != null)
      return `https://www.google.com/maps/dir/?api=1&destination=${p.latitude},${p.longitude}&travelmode=driving`;
    const q = [p.name, p.address, p.city, p.region, 'USA'].filter(Boolean).join(', ');
    return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(q);
  }
  /* Google's directions URL accepts at most 9 waypoints. The old navWholeDay
     just did .slice(0, 9), so on a 12-stop day THREE stops vanished from the
     route with nothing on screen to say so — you would drive the day and quietly
     miss the last few calls. Now the day is split into consecutive legs, each
     within the limit, with leg 2 starting where leg 1 finished. No stop is
     dropped, ever. */
  const MAX_WAYPOINTS = 9;
  function navLegs(day, stops) {
    const pts = stops.map(s => s._pt).filter(Boolean);
    if (!pts.length) return [];
    const start = day.start_lat != null ? { lat: day.start_lat, lng: day.start_lng } : null;
    const end   = day.end_lat   != null ? { lat: day.end_lat,   lng: day.end_lng   } : null;
    const legs = [];
    // cursor may be null on the first leg: with no hotel pinned, omitting origin
    // makes Google route from wherever the phone actually is.
    let cursor = start;
    let i = 0, n = 1, guard = 0;
    while (i < pts.length && guard++ < 20) {
      const chunk = pts.slice(i, i + MAX_WAYPOINTS);
      const isLast = i + chunk.length >= pts.length;
      let dest, wps;
      if (isLast && end) { dest = end; wps = chunk; }
      else { dest = chunk[chunk.length - 1]; wps = chunk.slice(0, -1); }
      const q = wps.map(p => `${p.lat},${p.lng}`).join('|');
      legs.push({
        n, stops: chunk.length,
        url: 'https://www.google.com/maps/dir/?api=1' +
             (cursor ? `&origin=${cursor.lat},${cursor.lng}` : '') +
             `&destination=${dest.lat},${dest.lng}` +
             (q ? '&waypoints=' + encodeURIComponent(q) : '') + '&travelmode=driving',
      });
      cursor = dest; i += chunk.length; n++;
    }
    return legs;
  }

  /* ---------- shell ---------- */
  function shell(inner, opts) {
    opts = opts || {};
    return `
    <div id="appbar">
      ${opts.back ? `<button class="tp-back" onclick="${opts.back}">‹</button>` : '<div class="mini-badge">BJ</div>'}
      <div class="titles">
        <div class="app-name">Bhagwati Jewels</div>
        <div class="screen-name">${esc(opts.title || 'Trip Planner')}</div>
      </div>
      <div style="margin-left:auto"></div>
      ${opts.back ? '' : '<a class="tp-signout" href="./" style="text-decoration:none">Find leads →</a>'}
    </div>
    <div id="content">${inner}</div>`;
  }

  /* ---------- trips list ---------- */
  async function loadTrips() {
    const { data } = await sb.from('lf_trips').select('*').order('created_at', { ascending: false });
    S.trips = data || [];
    const ids = S.trips.map(t => t.id);
    S.tripCounts = {};
    if (ids.length) {
      const { data: ds } = await sb.from('lf_trip_days').select('id, trip_id').in('trip_id', ids);
      const dayIds = (ds || []).map(d => d.id);
      const byTrip = {}; (ds || []).forEach(d => { byTrip[d.id] = d.trip_id; });
      let st = [];
      if (dayIds.length) { const { data } = await sb.from('lf_stops').select('day_id, status').in('day_id', dayIds); st = data || []; }
      S.trips.forEach(t => { S.tripCounts[t.id] = { days: 0, stops: 0, met: 0 }; });
      (ds || []).forEach(d => { if (S.tripCounts[d.trip_id]) S.tripCounts[d.trip_id].days++; });
      st.forEach(s => { const t = byTrip[s.day_id]; if (S.tripCounts[t]) { S.tripCounts[t].stops++; if (s.status === 'met') S.tripCounts[t].met++; } });
    }
  }
  async function renderTrips() {
    const { count: approved } = await sb.from('lf_places').select('id', { count: 'exact', head: true })
      .eq('hidden', false).eq('approved', true);
    const est = Math.max(1, Math.ceil((approved || 0) / 10));
    const list = S.trips.map(t => {
      const c = S.tripCounts[t.id] || { days: 0, stops: 0, met: 0 };
      return `<div class="tp-item" onclick="openTrip('${t.id}')">
        <h4>${esc(t.name)}</h4>
        <div class="tp-sub">${t.start_date ? fmtDate(t.start_date) : 'no dates yet'}${t.end_date && t.end_date !== t.start_date ? ' → ' + fmtDate(t.end_date) : ''}${t.region ? ' · ' + esc(t.region) : ''}</div>
        <div class="tp-chiprow">
          <span class="chip chip-plan">${c.days} day${c.days === 1 ? '' : 's'}</span>
          <span class="chip chip-plan">${c.stops} stop${c.stops === 1 ? '' : 's'}</span>
          ${c.met ? `<span class="chip chip-ok">${c.met} met</span>` : ''}
        </div>
      </div>`;
    }).join('');
    $app.innerHTML = shell(`
      <div class="tp-sum">
        <div class="big">${approved || 0} approved jewellers ready to visit</div>
        <div class="det">That's roughly <b>${est} packed day${est === 1 ? '' : 's'}</b> on the road at 8–12 stops a day. Approve more in the Finder to extend a trip.</div>
      </div>
      <button class="btn btn-primary" onclick="newTrip()">+ Plan a new trip</button>
      <div class="section-label">Your trips</div>
      ${list || '<div class="empty"><div class="big">🗺️</div>No trips yet.<br>Plan one — pick a state and dates, then fill each day from your approved list.</div>'}
      <div id="modal"></div>
    `, { title: 'Trip Planner' });
  }
  function newTrip() {
    document.getElementById('modal').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <h3>Plan a trip</h3>
          <div class="field"><label>Name it</label><input id="t-name" type="text" placeholder="e.g. South Florida — September"></div>
          <div class="field"><label>State</label><select id="t-region">${STATES.map(s => `<option>${s}</option>`).join('')}</select></div>
          <div class="tp-row2">
            <div class="field"><label>First day</label><input id="t-start" type="date"></div>
            <div class="field"><label>Last day</label><input id="t-end" type="date"></div>
          </div>
          <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveTrip()">Create</button>
          </div>
        </div>
      </div>`;
  }
  function closeModal() { const m = document.getElementById('modal'); if (m) m.innerHTML = ''; }
  async function saveTrip() {
    const name = document.getElementById('t-name').value.trim();
    if (!name) { toast('Give the trip a name', 'err'); return; }
    const row = { name, region: document.getElementById('t-region').value,
      start_date: document.getElementById('t-start').value || null,
      end_date: document.getElementById('t-end').value || null };
    const { data, error } = await sb.from('lf_trips').insert(row).select().single();
    if (error) { toast(error.message, 'err'); return; }
    closeModal(); toast('Trip created', 'ok'); openTrip(data.id);
  }

  /* ---------- one trip ---------- */
  async function openTrip(id) {
    const { data: t } = await sb.from('lf_trips').select('*').eq('id', id).single();
    S.trip = t;
    const { data: ds } = await sb.from('lf_trip_days').select('*').eq('trip_id', id).order('day_index');
    S.days = ds || [];
    const dayIds = S.days.map(d => d.id);
    S.dayStops = {};
    if (dayIds.length) {
      const { data: st } = await sb.from('lf_stops')
        .select('*, place:lf_places(id,name,address,city,region,postcode,phone,latitude,longitude,priority,segment,pitch_angle)')
        .in('day_id', dayIds).order('seq');
      (st || []).forEach(s => { (S.dayStops[s.day_id] = S.dayStops[s.day_id] || []).push(s); });
    }
    renderTrip();
  }
  function renderTrip() {
    const t = S.trip;
    const days = S.days.map(d => {
      const stops = (S.dayStops[d.id] || []).map(withPt);
      const m = dayMetrics(d, stops);
      const over = m.count > MAX_STOPS || m.total > MAX_HOURS * 60;
      const done = stops.filter(s => s.status !== 'planned').length;
      return `<div class="tp-item" onclick="openDay('${d.id}')">
        <button class="tp-kebab" onclick="event.stopPropagation();dayMenu('${d.id}')" aria-label="Day options">⋯</button>
        <h4>Day ${d.day_index}${d.day_date ? ' · ' + fmtDate(d.day_date) : ''}</h4>
        <div class="tp-sub">${d.start_label ? esc(d.start_label) : 'no start set'} → ${d.end_label ? esc(d.end_label) : 'no end set'}</div>
        <div class="tp-chiprow">
          <span class="chip ${over ? 'chip-warn' : 'chip-plan'}">${m.count} stop${m.count === 1 ? '' : 's'}</span>
          ${m.count ? `<span class="chip chip-plan">≈ ${hrs(m.total)} incl. visits</span>` : ''}
          ${done ? `<span class="chip chip-ok">${done} logged</span>` : ''}
          ${over ? '<span class="chip chip-warn">Overloaded</span>' : ''}
        </div>
      </div>`;
    }).join('');
    $app.innerHTML = shell(`
      <div class="tp-sum">
        <div class="tp-titlerow">
          <div class="grow">
            <div class="big">${esc(t.name)}</div>
            <div class="det">${t.region || ''}${t.start_date ? ' · ' + fmtDate(t.start_date) : ''}${t.end_date && t.end_date !== t.start_date ? ' → ' + fmtDate(t.end_date) : ''}</div>
          </div>
          <button class="tp-iconbtn" onclick="editTrip()">✎ Edit</button>
        </div>
      </div>
      <div class="section-label">Days</div>
      ${days || '<div class="empty">No days yet — add the first one.</div>'}
      <button class="btn btn-primary" onclick="addDay()">+ Add a day</button>
      <button class="btn btn-secondary" style="margin-top:9px" onclick="openReport()">📋 Trip report</button>
      <button class="btn btn-secondary" style="margin-top:9px;color:#a12b24" onclick="askDeleteTrip()">🗑 Delete this trip</button>
      <div id="modal"></div>
    `, { title: t.name, back: "backToTrips()" });
  }
  function backToTrips() { loadTrips().then(renderTrips); }
  async function addDay() {
    const idx = S.days.length + 1;
    let date = null;
    if (S.trip.start_date) {
      // Anchor at MIDDAY UTC and step in UTC. Parsing 'YYYY-MM-DDT00:00:00' gives
      // LOCAL midnight, and toISOString() then converts back to UTC — so from
      // India (UTC+5:30) every day came out one day EARLY. That date is fed into
      // the outreach message ("I am in {city} on {date}"), so the error reached
      // customers, not just the screen.
      const d = new Date(S.trip.start_date + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() + idx - 1);
      date = d.toISOString().slice(0, 10);
    }
    const prev = S.days[S.days.length - 1];
    const row = { trip_id: S.trip.id, day_index: idx, day_date: date };
    if (prev && prev.end_label) { row.start_label = prev.end_label; row.start_lat = prev.end_lat; row.start_lng = prev.end_lng; }
    const { data, error } = await sb.from('lf_trip_days').insert(row).select().single();
    if (error) { toast(error.message, 'err'); return; }
    openDay(data.id);
  }

  /* ---------- a day ---------- */
  function withPt(s) {
    const p = s.place || {};
    s._pt = (p.latitude != null && p.longitude != null) ? { lat: p.latitude, lng: p.longitude } : null;
    return s;
  }
  async function openDay(id) {
    const { data: d } = await sb.from('lf_trip_days').select('*').eq('id', id).single();
    S.day = d;
    const { data: st } = await sb.from('lf_stops')
      .select('*, place:lf_places(id,name,address,city,region,postcode,phone,latitude,longitude,priority,segment,pitch_angle)')
      .eq('day_id', id).order('seq');
    S.stops = (st || []).map(withPt);
    renderDay();
  }
  function renderDay() {
    const d = S.day, stops = S.stops;
    const m = dayMetrics(d, stops);
    const start = d.start_lat != null ? { lat: d.start_lat, lng: d.start_lng } : null;
    let prev = start;
    const rows = stops.map((s, i) => {
      const p = s.place || {};
      const leg = prev && s._pt ? km(prev, s._pt) : null;
      const legHtml = `<div class="tp-leg">↓ ${i === 0 && !start ? 'first stop' : fmtLeg(leg)}</div>`;
      if (s._pt) prev = s._pt;
      const addr = [p.address, p.city, p.postcode].filter(Boolean).join(', ');
      const logged = s.status !== 'planned';
      const outBtns = logged
        ? `<div class="tp-out"><span class="chip ${s.status === 'met' ? 'chip-ok' : s.status === 'buyer_out' ? 'chip-out' : 'chip-no'}">${
            s.status === 'met' ? '✓ Met the buyer' : s.status === 'buyer_out' ? '↻ Buyer was out' : s.status === 'not_interested' ? '✗ Not interested' : '– Skipped'}</span>
            <button class="ob-undo" onclick="setOutcome('${s.id}','planned')">undo</button></div>`
        : `<div class="tp-out">
             <button class="ob-met" onclick="setOutcome('${s.id}','met')">✓ Met buyer</button>
             <button class="ob-out" onclick="setOutcome('${s.id}','buyer_out')">↻ Buyer out</button>
             <button class="ob-no" onclick="setOutcome('${s.id}','not_interested')">✗ Not interested</button>
             <button class="ob-skip" onclick="setOutcome('${s.id}','skipped')">– Skip</button>
           </div>`;
      return legHtml + `<div class="tp-stop ${logged ? 'done ' + s.status : ''}">
        <div class="tp-seq">${i + 1}</div>
        <div class="tp-body">
          <div class="nm">${esc(p.name || 'Unknown')}${p.priority >= 5 ? ' ⭐' : ''}</div>
          ${addr ? `<div class="ad">${esc(addr)}</div>` : '<div class="ad">no address on file</div>'}
          ${p.pitch_angle ? `<div class="ad" style="margin-top:5px;color:var(--maroon)">🎯 ${esc(p.pitch_angle.split('. ')[0])}.</div>` : ''}
          <div class="tp-mini">
            ${p.phone ? `<a href="tel:${esc(digitsOnly(p.phone))}">📞 Call</a>` : ''}
            <a target="_blank" rel="noopener" href="${esc(navToPlace(p))}">🧭 Navigate</a>
            <a href="visits.html?place=${encodeURIComponent(p.id || '')}&stop=${encodeURIComponent(s.id)}&trip=${encodeURIComponent(S.trip ? S.trip.id : '')}">📝 Log visit</a>
            <button onclick="stopMenu('${s.id}')">⋯ Move / Remove</button>
          </div>
          ${outBtns}
        </div>
      </div>`;
    }).join('');
    const endLeg = (prev && d.end_lat != null) ? km(prev, { lat: d.end_lat, lng: d.end_lng }) : null;
    const legs = navLegs(d, stops);
    const over = m.count > MAX_STOPS || m.total > MAX_HOURS * 60;
    const light = m.count && m.count < SOFT_STOPS;
    $app.innerHTML = shell(`
      <div class="tp-ends">
        <div class="lbl">Start and end</div>
        <div class="tp-endline"><div class="pin pin-s">S</div>
          <div class="val ${d.start_label ? '' : 'empty'}">${esc(d.start_label || 'Where you set off from')}</div>
          <button class="btn btn-small btn-secondary" style="width:auto" onclick="editEnd('start')">Set</button></div>
        <div class="tp-endline"><div class="pin pin-e">E</div>
          <div class="val ${d.end_label ? '' : 'empty'}">${esc(d.end_label || 'Where you finish (can be a different city)')}</div>
          <button class="btn btn-small btn-secondary" style="width:auto" onclick="editEnd('end')">Set</button></div>
        <div class="tp-titlerow" style="margin-top:10px;gap:8px">
          <button class="tp-iconbtn" onclick="editDayDate()">✎ Change the date</button>
          <button class="tp-iconbtn danger" onclick="askDeleteDay(S.day.id)">🗑 Delete this day</button>
        </div>
      </div>

      <div class="tp-sum">
        <div class="big">${m.count} stop${m.count === 1 ? '' : 's'} · ≈ ${hrs(m.total)} on the clock</div>
        <div class="det">About ${hrs(m.drive)} driving${m.dist ? ' (' + Math.round(m.dist * 0.621371) + ' mi)' : ''} plus ${hrs(m.dwell)} in the shops at ${d.dwell_min} min each.${m.unknown ? ` ${m.unknown} stop${m.unknown === 1 ? ' has' : 's have'} no map pin — not counted in the drive time.` : ''}</div>
        ${over ? `<div class="tp-warn">⚠️ This day is overloaded — ${m.count > MAX_STOPS ? `${m.count} stops is past the 12 you can realistically make` : 'over 9 hours'}. Move a couple to another day.</div>` : ''}
        ${light ? `<div class="tp-good">Room for ${SOFT_STOPS - m.count} more — a packed day is 8–12 stops.</div>` : ''}
        ${!over && !light && m.count ? '<div class="tp-good">Well packed ✓</div>' : ''}
      </div>

      <div class="tp-row2">
        <button class="btn btn-secondary" onclick="optimise()">↕️ Best order</button>
        ${legs.length === 1 ? `<a class="btn btn-secondary" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(legs[0].url)}">🧭 Whole day</a>` : ''}
      </div>
      ${legs.length > 1 ? `<div class="tp-sum" style="margin-top:9px">
        <div class="big">🧭 Route in ${legs.length} legs</div>
        <div class="det">Google Maps takes at most ${MAX_WAYPOINTS} stops in one link, so this day opens as ${legs.length} routes. Drive leg 1, then open leg 2 — it starts where leg 1 ended, and every stop is covered.</div>
        <div class="tp-mini" style="margin-top:9px">
          ${legs.map(l => `<a target="_blank" rel="noopener" href="${esc(l.url)}">Leg ${l.n} · ${l.stops} stop${l.stops === 1 ? '' : 's'}</a>`).join('')}
        </div>
      </div>` : ''}

      <div class="section-label">The run${stops.length ? '' : ' — nothing added yet'}</div>
      ${rows || '<div class="empty"><div class="big">📍</div>Add your approved jewellers, then tap Best order.</div>'}
      ${endLeg != null ? `<div class="tp-leg">↓ ${fmtLeg(endLeg)} to ${esc(d.end_label)}</div>` : ''}

      <div class="tp-sticky"><button class="btn btn-primary" onclick="openPicker()">+ Add stops</button></div>
      <div id="modal"></div>
    `, { title: 'Day ' + d.day_index + (d.day_date ? ' · ' + fmtDate(d.day_date) : ''), back: `openTrip('${d.trip_id}')` });
  }
  /* ---------- editing and deleting: trips, days, stops ----------
     Everything destructive goes through an in-app confirmation sheet. Native
     confirm() is deliberately avoided: a browser modal blocks the page and, in
     a PWA on a phone, is easy to dismiss by accident. Deletes rely on the
     database cascades (trip -> days -> stops), so one delete is enough. */
  function closeSheet() { const el = document.getElementById('sheet'); if (el) el.remove(); }
  function sheet(html) {
    closeSheet();
    const el = document.createElement('div');
    el.id = 'sheet'; el.className = 'sheet';
    el.onclick = (e) => { if (e.target === el) closeSheet(); };
    el.innerHTML = `<div class="sheet-inner">${html}</div>`;
    document.body.appendChild(el);
  }

  /* ---- trip ---- */
  function editTrip() {
    const t = S.trip;
    document.getElementById('modal').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <h3>Edit trip</h3>
          <div class="field"><label>Name</label><input id="et-name" type="text" value="${esc(t.name || '')}"></div>
          <div class="field"><label>State</label><select id="et-region">${STATES.map(x =>
            `<option${x === t.region ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
          <div class="tp-row2">
            <div class="field"><label>First day</label><input id="et-start" type="date" value="${t.start_date || ''}"></div>
            <div class="field"><label>Last day</label><input id="et-end" type="date" value="${t.end_date || ''}"></div>
          </div>
          <p class="ep-hint">Changing the first day does not move days you have already added — use “Change the date” on a day for that.</p>
          <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveTripEdit()">Save</button>
          </div>
        </div>
      </div>`;
  }
  async function saveTripEdit() {
    const name = document.getElementById('et-name').value.trim();
    if (!name) { toast('Give the trip a name', 'err'); return; }
    const patch = { name, region: document.getElementById('et-region').value,
      start_date: document.getElementById('et-start').value || null,
      end_date: document.getElementById('et-end').value || null };
    const { error } = await sb.from('lf_trips').update(patch).eq('id', S.trip.id);
    if (error) { toast(error.message, 'err'); return; }
    Object.assign(S.trip, patch);
    closeModal(); toast('Trip updated ✓', 'ok'); renderTrip();
  }
  function askDeleteTrip() {
    const n = S.days.length;
    const stops = Object.values(S.dayStops || {}).reduce((a, v) => a + v.length, 0);
    sheet(`
      <h4>Delete “${esc(S.trip.name)}”?</h4>
      <p class="sheet-sub">This also removes ${n} day${n === 1 ? '' : 's'} and ${stops} planned stop${stops === 1 ? '' : 's'}. Your jewellers and their approvals are not affected. This cannot be undone.</p>
      <button class="sheet-act danger" onclick="doDeleteTrip()">Delete the trip</button>
      <button class="sheet-act cancel" onclick="closeSheet()">Keep it</button>`);
  }
  async function doDeleteTrip() {
    const { error } = await sb.from('lf_trips').delete().eq('id', S.trip.id);
    closeSheet();
    if (error) { toast(error.message, 'err'); return; }
    toast('Trip deleted', 'ok');
    S.trip = null; S.days = []; S.dayStops = {};
    await loadTrips(); renderTrips();
  }

  /* ---- day ---- */
  function dayMenu(dayId) {
    const d = S.days.find(x => x.id === dayId);
    if (!d) return;
    const stops = (S.dayStops[dayId] || []).length;
    sheet(`
      <h4>Day ${d.day_index}${d.day_date ? ' · ' + fmtDate(d.day_date) : ''}</h4>
      <p class="sheet-sub">${stops} stop${stops === 1 ? '' : 's'} planned</p>
      <button class="sheet-act" onclick="closeSheet();openDay('${dayId}')">Open this day</button>
      <button class="sheet-act" onclick="closeSheet();openDay('${dayId}').then(editDayDate)">Change the date</button>
      <button class="sheet-act danger" onclick="askDeleteDay('${dayId}')">Delete this day</button>
      <button class="sheet-act cancel" onclick="closeSheet()">Cancel</button>`);
  }
  function editDayDate() {
    const d = S.day;
    if (!d) return;
    closeSheet();
    document.getElementById('modal').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
          <h3>Date for day ${d.day_index}</h3>
          <div class="field"><input id="dd-date" type="date" value="${d.day_date || ''}"></div>
          <p class="ep-hint">This date is what gets written into the opening message you send jewellers, so keep it accurate.</p>
          <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveDayDate()">Save</button>
          </div>
        </div>
      </div>`;
  }
  async function saveDayDate() {
    const v = document.getElementById('dd-date').value || null;
    const { error } = await sb.from('lf_trip_days').update({ day_date: v }).eq('id', S.day.id);
    if (error) { toast(error.message, 'err'); return; }
    S.day.day_date = v;
    closeModal(); toast('Date updated ✓', 'ok'); renderDay();
  }
  function askDeleteDay(dayId) {
    const d = S.days.find(x => x.id === dayId) || S.day;
    const stops = (S.dayStops[dayId] || S.stops || []).length;
    sheet(`
      <h4>Delete day ${d ? d.day_index : ''}?</h4>
      <p class="sheet-sub">${stops} planned stop${stops === 1 ? '' : 's'} on this day will be removed with it. The jewellers themselves stay in your list, and any outcomes you logged are lost. This cannot be undone.</p>
      <button class="sheet-act danger" onclick="doDeleteDay('${dayId}')">Delete the day</button>
      <button class="sheet-act cancel" onclick="closeSheet()">Keep it</button>`);
  }
  async function doDeleteDay(dayId) {
    const tripId = (S.day && S.day.trip_id) || (S.trip && S.trip.id);
    const { error } = await sb.from('lf_trip_days').delete().eq('id', dayId);
    closeSheet();
    if (error) { toast(error.message, 'err'); return; }
    // keep Day 1, Day 2, Day 3 contiguous after a deletion
    const { data: left } = await sb.from('lf_trip_days').select('id, day_index')
      .eq('trip_id', tripId).order('day_index');
    let i = 1;
    for (const row of left || []) {
      if (row.day_index !== i) await sb.from('lf_trip_days').update({ day_index: i }).eq('id', row.id);
      i++;
    }
    toast('Day deleted', 'ok');
    openTrip(tripId);
  }

  /* ---- stop ---- */
  function stopMenu(stopId) {
    const s = S.stops.find(x => x.id === stopId);
    if (!s) return;
    const p = s.place || {};
    const others = S.days.filter(d => d.id !== S.day.id);
    sheet(`
      <h4>${esc(p.name || 'Stop')}</h4>
      <p class="sheet-sub">${esc([p.address, p.city].filter(Boolean).join(', ') || 'no address on file')}</p>
      ${others.length ? others.map(d => `<button class="sheet-act" onclick="moveStop('${stopId}','${d.id}')">Move to day ${d.day_index}${d.day_date ? ' · ' + fmtDate(d.day_date) : ''}</button>`).join('') : ''}
      <button class="sheet-act danger" onclick="closeSheet();removeStop('${stopId}')">Remove from this trip</button>
      <button class="sheet-act cancel" onclick="closeSheet()">Cancel</button>`);
  }
  async function moveStop(stopId, dayId) {
    const { data: existing } = await sb.from('lf_stops').select('id').eq('day_id', dayId);
    const seq = (existing || []).length;
    const { error } = await sb.from('lf_stops').update({ day_id: dayId, seq }).eq('id', stopId);
    closeSheet();
    if (error) { toast(error.message, 'err'); return; }
    const d = S.days.find(x => x.id === dayId);
    toast(`Moved to day ${d ? d.day_index : ''} ✓`, 'ok');
    openDay(S.day.id);
  }

  /* ---------- start / end place picker ----------
     Was a bare text box that silently geocoded on save. Now: typeahead against
     TomTom (via the lf-geosearch edge function, so the key stays server-side),
     the phone's own GPS, pasted coordinates or Google Maps links, previously
     used places, and a map you confirm the pin on before saving. */
  function editEnd(which) {
    const d = S.day;
    const lbl = which === 'start' ? d.start_label : d.end_label;
    const lat = which === 'start' ? d.start_lat : d.end_lat;
    const lng = which === 'start' ? d.start_lng : d.end_lng;
    S.ep = { which, sug: [], chosen: (lat != null ? { name: lbl, address: '', lat, lon: lng } : null), map: null, marker: null, t: null };
    const recents = recentPlaces();
    document.getElementById('modal').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal" style="max-height:90vh;overflow-y:auto">
          <h3>${which === 'start' ? 'Where do you set off from?' : 'Where does the day end?'}</h3>
          <p class="ep-hint">Type a hotel or address and pick from the list — you don't need the full address. You can also paste a Google Maps link, or use where you are now.</p>
          <div class="ep-row">
            <input id="ep-q" type="text" autocomplete="off" placeholder="e.g. Hilton Fort Lauderdale" value="${esc(lbl || '')}" oninput="epType(this.value)">
            <button class="ep-loc" id="ep-loc" onclick="epHere()">📍 I'm here</button>
          </div>
          ${recents.length ? `<div class="ep-chips">${recents.map((r, i) =>
            `<button onclick="epRecent(${i})">${esc(r.name.length > 28 ? r.name.slice(0, 27) + '…' : r.name)}</button>`).join('')}</div>` : ''}
          <ul class="ep-sug" id="ep-sug" style="display:none"></ul>
          <div id="ep-conf"></div>
          <div id="ep-map"></div>
          <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" id="ep-save" onclick="epSave()">Save</button>
          </div>
        </div>
      </div>`;
    S.epRecents = recents;
    if (S.ep.chosen) epShow(S.ep.chosen, true);
    setTimeout(() => { const el = document.getElementById('ep-q'); if (el) { el.focus(); el.select(); } }, 60);
  }

  // hotels and airports already used on this trip, most recent first
  function recentPlaces() {
    const seen = new Set(), out = [];
    for (const d of [...S.days].reverse()) {
      for (const [l, a, o] of [[d.end_label, d.end_lat, d.end_lng], [d.start_label, d.start_lat, d.start_lng]]) {
        if (!l || a == null) continue;
        const k = l.toLowerCase();
        if (seen.has(k)) continue;
        seen.add(k); out.push({ name: l, address: '', lat: a, lon: o });
      }
    }
    return out.slice(0, 4);
  }

  // a pasted Google Maps link or a raw "lat, lng" is already an exact point
  function coordsFromText(t) {
    const s = String(t || '');
    let m = s.match(/@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/)
         || s.match(/[?&](?:q|query|ll|daddr)=(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/)
         || s.match(/^\s*(-?\d{1,2}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})\s*$/);
    if (!m) return null;
    const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
    if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
    return { lat, lon };
  }

  /* Clearing the pin the moment the text is edited is the important part here.
     Without it the label and the coordinates could drift apart: a Google link was
     once saved as the label while the pin still held a place 40 miles away, and
     nothing on screen showed the mismatch. If the text changes, the pin goes and
     a new one must be picked. */
  function epUnpick() {
    S.ep.chosen = null;
    const c = document.getElementById('ep-conf'); if (c) c.innerHTML = '';
    const el = document.getElementById('ep-map'); if (el) el.style.display = 'none';
  }

  function epType(v) {
    const txt = (v || '').trim();
    if (S.ep.chosen && txt !== (S.ep.chosen.name || '').trim()) epUnpick();
    const pasted = coordsFromText(v);
    if (pasted) {
      epReverse(pasted.lat, pasted.lon, 'Pinned from the link you pasted');
      return;
    }
    clearTimeout(S.ep.t);
    // A shortened maps.app.goo.gl link carries no coordinates. Searching for the
    // URL as if it were a hotel name is how a wrong pin got saved, so resolve the
    // link server-side instead of ever text-searching it.
    if (/^https?:\/\//i.test(txt)) {
      S.ep.t = setTimeout(() => epResolve(txt), 350);
      return;
    }
    if (txt.length < 3) { const u = document.getElementById('ep-sug'); if (u) u.style.display = 'none'; return; }
    S.ep.t = setTimeout(() => epSearch(txt), 450);
  }

  async function epResolve(link) {
    const conf = document.getElementById('ep-conf');
    if (conf) conf.innerHTML = '<div class="ep-hint">Following that link…</div>';
    let res = null, err = null;
    try {
      const { data, error } = await sb.functions.invoke('lf-geosearch', { body: { resolve: link } });
      if (error) err = 'the link could not be followed';
      else if (data && Array.isArray(data.results) && data.results.length) res = data.results;
      else err = (data && data.error) || 'it did not lead to a place';
    } catch (e) { err = 'the link could not be followed'; }

    const u = document.getElementById('ep-sug');
    if (!res) {
      if (conf) conf.innerHTML = `<div class="warn-box">That link could not be read — ${esc(err)}. Type the hotel or airport name instead and pick it from the list.</div>`;
      if (u) u.style.display = 'none';
      return;
    }
    if (res.length === 1) {
      document.getElementById('ep-q').value = res[0].name;
      if (u) u.style.display = 'none';
      epShow(res[0], false, 'Read from the link you pasted');
      return;
    }
    S.ep.sug = res;
    if (u) {
      u.style.display = 'block';
      u.innerHTML = res.map((r, i) =>
        `<li onclick="epPick(${i})"><div class="s-nm">${esc(r.name)}</div><div class="s-ad">${esc(r.address || '')}</div></li>`).join('');
    }
    if (conf) conf.innerHTML = '<div class="ep-hint">That link names a place — pick the right match below.</div>';
  }

  async function epSearch(q) {
    const anchor = tripAnchor();
    const payload = { q, region: (S.trip && S.trip.region) || null };
    if (anchor) { payload.lat = anchor.lat; payload.lon = anchor.lng; }
    let results = [];
    try {
      const { data, error } = await sb.functions.invoke('lf-geosearch', { body: payload });
      if (!error && data && Array.isArray(data.results)) results = data.results;
    } catch (e) { /* leave empty */ }
    S.ep.sug = results;
    const u = document.getElementById('ep-sug');
    if (!u) return;
    if (!results.length) {
      u.style.display = 'block';
      u.innerHTML = '<li style="cursor:default"><div class="s-ad">Nothing found. Try the hotel name plus the town, or paste a Google Maps link.</div></li>';
      return;
    }
    u.style.display = 'block';
    u.innerHTML = results.map((r, i) =>
      `<li onclick="epPick(${i})"><div class="s-nm">${esc(r.name)}</div><div class="s-ad">${esc(r.address || '')}</div></li>`).join('');
  }

  // centre searches on the trip: the day's stops, else the state's approved stores
  function tripAnchor() {
    const d = S.day;
    if (d && d.start_lat != null) return { lat: d.start_lat, lng: d.start_lng };
    if (d && d.end_lat != null) return { lat: d.end_lat, lng: d.end_lng };
    const withPt = (S.stops || []).find(s => s._pt);
    return withPt ? withPt._pt : null;
  }

  function epPick(i) {
    const r = S.ep.sug[i];
    if (!r) return;
    document.getElementById('ep-q').value = r.name;
    document.getElementById('ep-sug').style.display = 'none';
    epShow(r);
  }
  function epRecent(i) {
    const r = (S.epRecents || [])[i];
    if (!r) return;
    document.getElementById('ep-q').value = r.name;
    document.getElementById('ep-sug').style.display = 'none';
    epShow(r);
  }

  function epHere() {
    const btn = document.getElementById('ep-loc');
    if (!navigator.geolocation) { toast('This device will not share its location', 'err'); return; }
    btn.disabled = true; btn.textContent = 'Locating…';
    navigator.geolocation.getCurrentPosition(
      pos => { epReverse(pos.coords.latitude, pos.coords.longitude, 'Pinned to where you are now'); btn.disabled = false; btn.textContent = "📍 I'm here"; },
      err => {
        btn.disabled = false; btn.textContent = "📍 I'm here";
        toast(err.code === 1 ? 'Location permission was declined' : 'Could not get your location', 'err');
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  }

  async function epReverse(lat, lon, why) {
    let r = { name: lat.toFixed(5) + ', ' + lon.toFixed(5), address: '', lat, lon };
    try {
      const { data, error } = await sb.functions.invoke('lf-geosearch', { body: { reverse: true, lat, lon } });
      if (!error && data && data.results && data.results[0]) r = data.results[0];
    } catch (e) { /* keep the raw coordinates */ }
    const q = document.getElementById('ep-q'); if (q) q.value = r.name;
    const u = document.getElementById('ep-sug'); if (u) u.style.display = 'none';
    epShow(r, false, why);
  }

  // show the chosen point on a small map with a draggable pin
  function epShow(r, quiet, why) {
    S.ep.chosen = { name: r.name, address: r.address || '', lat: r.lat, lon: r.lon };
    const conf = document.getElementById('ep-conf');
    if (conf) conf.innerHTML = `<div class="ep-conf">✓ ${esc(why || 'Pinned on the map below')} — drag the pin if it is slightly off</div>`;
    const el = document.getElementById('ep-map');
    if (!el) return;
    el.style.display = 'block';
    if (!S.ep.map) {
      S.ep.map = L.map(el, { zoomControl: true, attributionControl: false }).setView([r.lat, r.lon], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(S.ep.map);
      S.ep.marker = L.marker([r.lat, r.lon], { draggable: true }).addTo(S.ep.map);
      S.ep.marker.on('dragend', () => {
        const p = S.ep.marker.getLatLng();
        S.ep.chosen.lat = p.lat; S.ep.chosen.lon = p.lng;
        const c = document.getElementById('ep-conf');
        if (c) c.innerHTML = '<div class="ep-conf">✓ Pin moved — this exact spot will be saved</div>';
      });
      setTimeout(() => S.ep.map.invalidateSize(), 80);
    } else {
      S.ep.map.setView([r.lat, r.lon], 15);
      S.ep.marker.setLatLng([r.lat, r.lon]);
      setTimeout(() => S.ep.map.invalidateSize(), 80);
    }
  }

  async function epSave() {
    const which = S.ep.which;
    const typed = (document.getElementById('ep-q').value || '').trim();
    const patch = {};
    if (!typed && !S.ep.chosen) {
      patch[which + '_label'] = null; patch[which + '_lat'] = null; patch[which + '_lng'] = null;
    } else if (!S.ep.chosen) {
      toast('Pick a place from the list so the map has a pin', 'err');
      return;
    } else {
      // the pin is the source of truth; never save a label that describes somewhere else
      const chosenName = (S.ep.chosen.name || '').trim();
      patch[which + '_label'] = (typed && typed === chosenName) ? typed : chosenName;
      patch[which + '_lat'] = S.ep.chosen.lat;
      patch[which + '_lng'] = S.ep.chosen.lon;
    }
    const { error } = await sb.from('lf_trip_days').update(patch).eq('id', S.day.id);
    if (error) { toast(error.message, 'err'); return; }
    Object.assign(S.day, patch);
    S.ep.map = null; S.ep.marker = null;
    closeModal(); toast('Saved ✓', 'ok');
    renderDay();
  }

  /* ---------- picker ---------- */
  async function openPicker() {
    toast('Loading your approved list…');
    const region = (S.trip && S.trip.region) || null;
    let q = sb.from('lf_places').select('id,name,address,city,region,postcode,phone,latitude,longitude,priority,segment')
      .eq('hidden', false).eq('approved', true).order('priority', { ascending: false, nullsFirst: false }).limit(500);
    if (region) q = q.eq('region', region);
    const { data, error } = await q;
    if (error) { toast(error.message, 'err'); return; }
    const dayIds = S.days.map(d => d.id);
    let used = {}, retry = {};
    if (dayIds.length) {
      const { data: st } = await sb.from('lf_stops').select('place_id, day_id, status').in('day_id', dayIds);
      (st || []).forEach(s => {
        if (s.status === 'buyer_out') retry[s.place_id] = true;
        else used[s.place_id] = (s.day_id === S.day.id ? 'here' : 'other');
      });
    }
    const anchor = S.day.start_lat != null ? { lat: S.day.start_lat, lng: S.day.start_lng }
      : (S.stops.length && S.stops[0]._pt) ? S.stops[0]._pt : null;
    const rows = (data || []).map(p => {
      const pt = (p.latitude != null) ? { lat: p.latitude, lng: p.longitude } : null;
      const d = anchor && pt ? km(anchor, pt) : null;
      return { p, d, used: used[p.id], retry: !!retry[p.id] };
    });
    rows.sort((a, b) => (b.retry - a.retry) || ((a.d == null) - (b.d == null)) || ((a.d || 0) - (b.d || 0)) || ((b.p.priority || 0) - (a.p.priority || 0)));
    S.pick = { rows, sel: {}, q: '' };
    renderPicker();
  }
  function renderPicker() {
    const term = (S.pick.q || '').toLowerCase();
    const list = S.pick.rows.filter(r => !term || (r.p.name + ' ' + (r.p.city || '')).toLowerCase().includes(term));
    const nSel = Object.keys(S.pick.sel).length;
    const items = list.slice(0, 200).map(r => {
      const p = r.p, on = !!S.pick.sel[p.id];
      const dist = r.d != null ? `${(r.d * 0.621371).toFixed(r.d < 16 ? 1 : 0)} mi away` : 'no map pin';
      return `<div class="pick-item ${on ? 'on' : ''} ${r.used ? 'used' : ''}" onclick="togglePick('${p.id}')">
        <div class="pk-tick">${on ? '☑' : r.used ? '•' : '☐'}</div>
        <div class="pk-main">
          <div class="pk-nm">${esc(p.name)}${p.priority >= 5 ? ' ⭐' : ''}${r.retry ? ' ↻' : ''}</div>
          <div class="pk-sub">${esc(p.city || p.region || '')} · ${dist}${r.used === 'here' ? ' · already on this day' : r.used === 'other' ? ' · on another day' : ''}${r.retry ? ' · buyer was out — retry' : ''}</div>
        </div>
      </div>`;
    }).join('');
    document.getElementById('modal').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal" style="max-height:88vh;overflow-y:auto">
          <h3>Add stops</h3>
          <p>Your approved jewellers${S.trip.region ? ' in ' + esc(S.trip.region) : ''}, nearest to the day's start first. ↻ means the buyer was out last time.</p>
          <div class="field"><input id="pk-q" type="text" placeholder="Search by name or city" value="${esc(S.pick.q)}" oninput="pickSearch(this.value)"></div>
          ${items || '<div class="empty">Nothing matches.</div>'}
          <div class="modal-actions" style="position:sticky;bottom:0;background:var(--card);padding-top:10px">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="addPicked()">Add ${nSel || ''}</button>
          </div>
        </div>
      </div>`;
  }
  function pickSearch(v) { S.pick.q = v; renderPicker(); const el = document.getElementById('pk-q'); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }
  function togglePick(id) { if (S.pick.sel[id]) delete S.pick.sel[id]; else S.pick.sel[id] = true; renderPicker(); }
  async function addPicked() {
    const ids = Object.keys(S.pick.sel);
    if (!ids.length) { closeModal(); return; }
    const have = new Set(S.stops.map(s => s.place_id));
    const fresh = ids.filter(id => !have.has(id));
    if (!fresh.length) { toast('Those are already on this day'); closeModal(); return; }
    let seq = S.stops.length;
    const rows = fresh.map(id => ({ day_id: S.day.id, place_id: id, seq: seq++ }));
    const { error } = await sb.from('lf_stops').insert(rows);
    if (error) { toast(error.message, 'err'); return; }
    closeModal(); toast(`${fresh.length} stop${fresh.length === 1 ? '' : 's'} added`, 'ok');
    await openDay(S.day.id);
    if (S.stops.length > 1) optimise(true);
  }
  async function removeStop(id) {
    const { error } = await sb.from('lf_stops').delete().eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    toast('Removed'); openDay(S.day.id);
  }
  async function optimise(quiet) {
    const d = S.day;
    const start = d.start_lat != null ? { lat: d.start_lat, lng: d.start_lng } : null;
    const end = d.end_lat != null ? { lat: d.end_lat, lng: d.end_lng } : null;
    const items = S.stops.map(s => ({ id: s.id, lat: s._pt ? s._pt.lat : null, lng: s._pt ? s._pt.lng : null }));
    const ordered = orderStops(start, items, end);
    for (let i = 0; i < ordered.length; i++) await sb.from('lf_stops').update({ seq: i }).eq('id', ordered[i].id);
    if (!quiet) toast('Ordered for the shortest run ✓', 'ok');
    openDay(d.id);
  }
  async function setOutcome(id, status) {
    const patch = { status, visited_at: status === 'planned' ? null : new Date().toISOString() };
    const { error } = await sb.from('lf_stops').update(patch).eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    if (status === 'buyer_out') toast('Noted — they will show as ↻ retry when you plan another day');
    else if (status === 'met') toast('Logged ✓', 'ok');
    openDay(S.day.id);
  }

  /* ---------- trip report ---------- */
  async function openReport() {
    const dayIds = S.days.map(d => d.id);
    let st = [];
    if (dayIds.length) {
      const { data } = await sb.from('lf_stops')
        .select('*, place:lf_places(name,city,phone)').in('day_id', dayIds).order('seq');
      st = data || [];
    }
    const by = s => st.filter(x => x.status === s);
    const met = by('met'), out = by('buyer_out'), no = by('not_interested'), sk = by('skipped'), pl = by('planned');
    const nameOf = s => `${(s.place || {}).name || '?'}${(s.place || {}).city ? ' — ' + s.place.city : ''}`;
    const listOf = arr => arr.length ? '<ul style="margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6">' + arr.map(s => `<li>${esc(nameOf(s))}</li>`).join('') + '</ul>' : '';
    S.report = { t: S.trip.name, met: met.map(nameOf), out: out.map(nameOf), no: no.map(nameOf), sk: sk.length, pl: pl.length };
    $app.innerHTML = shell(`
      <div class="tp-sum">
        <div class="big">${esc(S.trip.name)}</div>
        <div class="det">${S.days.length} day${S.days.length === 1 ? '' : 's'} · ${st.length} stop${st.length === 1 ? '' : 's'} planned</div>
      </div>
      <div class="card">
        <div class="rep-line"><span>✓ Met the buyer</span><b>${met.length}</b></div>
        <div class="rep-line"><span>↻ Buyer was out</span><b>${out.length}</b></div>
        <div class="rep-line"><span>✗ Not interested</span><b>${no.length}</b></div>
        <div class="rep-line"><span>– Skipped</span><b>${sk.length}</b></div>
        <div class="rep-line"><span>Still to do</span><b>${pl.length}</b></div>
      </div>
      ${met.length ? `<div class="card"><h3>Met — follow these up</h3>${listOf(met)}</div>` : ''}
      ${out.length ? `<div class="card"><h3>Worth another try</h3><p class="tp-sub">The buyer wasn't in. They show with ↻ when you add stops to any day.</p>${listOf(out)}</div>` : ''}
      ${no.length ? `<div class="card"><h3>Not interested</h3>${listOf(no)}</div>` : ''}
      <button class="btn btn-secondary" onclick="copyReport()">📋 Copy as text</button>
      <div id="modal"></div>
    `, { title: 'Trip report', back: `openTrip('${S.trip.id}')` });
  }
  function copyReport() {
    const r = S.report; if (!r) return;
    const L = [];
    L.push(r.t, '');
    L.push(`Met the buyer: ${r.met.length}`); r.met.forEach(n => L.push('  • ' + n));
    L.push(`Buyer was out: ${r.out.length}`); r.out.forEach(n => L.push('  • ' + n));
    L.push(`Not interested: ${r.no.length}`); r.no.forEach(n => L.push('  • ' + n));
    L.push(`Skipped: ${r.sk}`, `Still to do: ${r.pl}`);
    const text = L.join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copied ✓', 'ok'), () => toast('Could not copy', 'err'));
    else toast('Copy not supported here', 'err');
  }

  /* ---------- auth / boot ---------- */
  function renderLogin(msg) {
    $app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-head"><div class="logo-badge" style="margin:0 auto">BJ</div>
        <h1>Trip Planner</h1><p>Sign in with your marketing app account</p></div>
      <div class="auth-card">
        ${msg ? `<div class="notice">${esc(msg)}</div>` : ''}
        <div class="field"><label>Email</label><input type="email" id="li-email" autocomplete="username"></div>
        <div class="field"><label>Password</label><input type="password" id="li-pass" autocomplete="current-password"></div>
        <button class="btn btn-primary" onclick="doLogin()">Sign in</button>
      </div>
    </div>`;
  }
  async function doLogin() {
    const email = document.getElementById('li-email').value.trim();
    const pass = document.getElementById('li-pass').value;
    if (!email || !pass) { toast('Enter email and password', 'err'); return; }
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) { toast(error.message, 'err'); return; }
    init();
  }
  /* Supabase caps ANY single response at 1,000 rows regardless of the limit you
     ask for. lf_areas holds 1,145 rows, so this used to read 1,000 of them and
     Texas — which has one area — fell off the end. The state dropdown therefore
     still hid a state, which is the exact bug the dynamic list was meant to fix.
     lf_health is one row per state, so it is both complete and cheap. */
  async function loadStates() {
    try {
      const { data } = await sb.from('lf_health').select('region');
      const found = [...new Set((data || []).map(r => r.region).filter(Boolean))].sort();
      if (found.length) STATES = found;
    } catch (e) { /* keep fallback */ }
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { renderLogin(); return; }
    S.user = session.user;
    const { data: prof, error } = await sb.from('profiles').select('role, active').eq('id', S.user.id).single();
    if (error || !prof || prof.role !== 'owner' || !prof.active) {
      $app.innerHTML = `<div class="auth-wrap"><div class="auth-card" style="text-align:center">
        <h2>Owner only</h2><p class="sub">The Trip Planner is currently available only to the owner account.</p></div></div>`;
      return;
    }
    await loadStates();
    await loadTrips(); renderTrips();
  }
  window.doLogin = doLogin; window.newTrip = newTrip; window.saveTrip = saveTrip; window.closeModal = closeModal;
  window.openTrip = openTrip; window.backToTrips = backToTrips; window.addDay = addDay; window.openDay = openDay;
  window.closeSheet = closeSheet;
  window.editTrip = editTrip; window.saveTripEdit = saveTripEdit;
  window.askDeleteTrip = askDeleteTrip; window.doDeleteTrip = doDeleteTrip;
  window.dayMenu = dayMenu; window.editDayDate = editDayDate; window.saveDayDate = saveDayDate;
  window.askDeleteDay = askDeleteDay; window.doDeleteDay = doDeleteDay;
  window.stopMenu = stopMenu; window.moveStop = moveStop;
  window.editEnd = editEnd; window.epType = epType; window.epPick = epPick;
  window.epRecent = epRecent; window.epHere = epHere; window.epSave = epSave; window.openPicker = openPicker; window.pickSearch = pickSearch;
  window.togglePick = togglePick; window.addPicked = addPicked; window.removeStop = removeStop;
  window.optimise = optimise; window.setOutcome = setOutcome; window.openReport = openReport; window.copyReport = copyReport;
  init();
  </script>
</body>
</html>
