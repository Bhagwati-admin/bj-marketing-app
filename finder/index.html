<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b1e3c">
  <title>Bhagwati Jewels — Lead Finder</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://njikksnabvdmzynepdgw.supabase.co/storage/v1/object/public/web/finder-icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lead Finder">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    /* Lead Finder additions (matches main app design language) */
    .lf-searchbar { display: flex; gap: 8px; margin-bottom: 10px; }
    .lf-add { flex: 0 0 auto; width: 46px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 22px; color: var(--maroon); cursor: pointer; box-shadow: var(--shadow); }
    .lf-searchbar input { flex: 1; border: 1.5px solid var(--line); border-radius: 999px; padding: 12px 18px; font-size: 16px; outline: none; background: #fff; box-shadow: var(--shadow); min-width: 0; }
    .lf-searchbar input:focus { border-color: var(--maroon); }
    .lf-controls { display: flex; gap: 8px; margin-bottom: 12px; }
    .lf-controls select { border: 1.5px solid var(--line); border-radius: 11px; padding: 9px 10px; background: #fff; font-size: 14px; }
    .lf-controls .btn { flex: 0 0 auto; }
    .lf-count { font-size: 13.5px; color: var(--muted); margin: 2px 2px 10px; }
    .lf-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 15px; margin-bottom: 11px; cursor: pointer; }
    .lf-card:active { background: #fdfaf6; }
    .lf-name { font-weight: 700; font-size: 16px; }
    .lf-addr { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
    .lf-chiprow { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
    .chip-pending { background: #fcefd2; color: #92600a; }
    .chip-approved { background: #e3f2e7; color: #16663c; }
    .chip-rejected { background: #fbe1df; color: #a12b24; }
    .chip-src { background: #eee9f2; color: #5b4a6b; }
    .lf-contacts { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
    .lf-cbtn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: #fff;
      border-radius: 999px; padding: 8px 13px; font-size: 13.5px; font-weight: 650; color: var(--maroon); text-decoration: none; }
    .lf-cbtn:active { background: var(--maroon-soft); }
    .lf-actions { display: flex; gap: 8px; margin-top: 11px; }
    .lf-actions .btn { flex: 1; }
    .btn-approve { background: #e3f2e7; color: #16663c; }
    .btn-reject { background: #fbe1df; color: #a12b24; }
    .btn-research { background: #ede7f6; color: #4a3a7a; }
    .lf-reset { background: none; border: 0; color: var(--muted); font-size: 12.5px; margin-top: 8px; cursor: pointer; padding: 4px 2px; text-decoration: underline; }
    #lf-map { height: 62vh; border-radius: var(--radius); box-shadow: var(--shadow); display: none; }
    .lf-viewtabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .lf-viewtabs button { flex: 1; border: 1.5px solid var(--line); background: #fff; border-radius: 11px; padding: 9px; font-size: 14px; font-weight: 650; color: #5d5765; cursor: pointer; }
    .lf-viewtabs button.on { background: var(--maroon); border-color: var(--maroon); color: #fff; }
    .lf-home-stats { display: flex; gap: 10px; margin-bottom: 14px; }
    .lf-signout { background: none; border: 0; color: rgba(255,255,255,.85); font-size: 12.5px; cursor: pointer; padding: 6px 0 6px 10px; }
    .leaflet-container { font: inherit; }
  </style>
</head>
<body>
  <div id="app">
    <div class="splash">
      <div class="logo-badge">BJ</div>
      <p>Bhagwati Jewels · Lead Finder</p>
    </div>
  </div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../config.js"></script>
  <script>
  'use strict';
  const sb = window.supabase.createClient(BJ_CONFIG.SUPABASE_URL, BJ_CONFIG.SUPABASE_KEY);
  const $app = document.getElementById('app');
  const S = {
    user: null,
    results: [],
    filter: 'all',        // all | pending | approved | rejected
    view: 'list',         // list | map
    state: '',            // chosen state filter
    buf: '10',            // chosen buffer km
    areaLabel: '',
    lastQueryDesc: '',
    map: null, markers: [],
    homeCounts: null,
    rejectTarget: null,
  };
  const REJECT_REASONS = ['Natural only', 'Silver / fashion only', 'Pawn shop', 'Chain store', 'Repair / watch only', 'Closed', 'Not a jeweller', 'Other'];
  const STATES = ['FL', 'NY', 'NJ'];

  /* ---------- utils ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function toast(msg, cls) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show' + (cls ? ' ' + cls : '');
    clearTimeout(toast._h); toast._h = setTimeout(() => { t.className = ''; }, 2600);
  }
  function digitsOnly(p) { return (p || '').replace(/[^0-9+]/g, ''); }
  function waLink(p) {
    let d = digitsOnly(p).replace(/^\+/, '');
    if (!d) return null;
    if (d.length === 10) d = '1' + d;           // US default
    return 'https://wa.me/' + d;
  }
  function smsLink(p) {
    let d = digitsOnly(p).replace(/^\+/, '');
    if (!d) return null;
    if (d.length === 10) d = '1' + d;           // US default
    return 'sms:+' + d;
  }
  function igLink(v) {
    if (!v) return null;
    if (/^https?:/i.test(v)) return v;
    return 'https://www.instagram.com/' + v.replace(/^@/, '');
  }
  function fbLink(v) {
    if (!v) return null;
    if (/^https?:/i.test(v)) return v;
    return 'https://www.facebook.com/' + v;
  }
  function webLink(v) {
    if (!v) return null;
    return /^https?:/i.test(v) ? v : 'https://' + v;
  }
  function mapsLink(p) {
    if (p.latitude != null && p.longitude != null)
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ', ' + (p.address || '') + ' ' + (p.city || '')) ;
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ' ' + (p.city || p.region || ''));
  }
  function statusOf(p) { return p.approved === true ? 'approved' : p.approved === false ? 'rejected' : 'pending'; }

  /* ---------- shell ---------- */
  function shell(inner, opts) {
    opts = opts || {};
    return `
    <div id="appbar">
      <div class="mini-badge">BJ</div>
      <div class="titles">
        <div class="app-name">Bhagwati Jewels</div>
        <div class="screen-name">Lead Finder${opts.sub ? ' · ' + esc(opts.sub) : ''}</div>
      </div>
      <div style="margin-left:auto"></div>
      <button class="lf-signout" onclick="doSignOut()">Sign out</button>
    </div>
    <div id="content">${inner}</div>`;
  }

  /* ---------- auth ---------- */
  function renderLogin(msg) {
    $app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-head">
        <div class="logo-badge" style="margin:0 auto">BJ</div>
        <h1>Lead Finder</h1>
        <p>Sign in with your marketing app account</p>
      </div>
      <div class="auth-card">
        ${msg ? `<div class="notice">${esc(msg)}</div>` : ''}
        <div class="field"><label>Email</label><input type="email" id="li-email" autocomplete="username"></div>
        <div class="field"><label>Password</label><input type="password" id="li-pass" autocomplete="current-password"></div>
        <button class="btn btn-primary" onclick="doLogin()">Sign in</button>
      </div>
    </div>`;
  }
  async function doLogin() {
    const email = document.getElementById('li-email').value.trim();
    const pass = document.getElementById('li-pass').value;
    if (!email || !pass) { toast('Enter email and password', 'err'); return; }
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) { toast(error.message, 'err'); return; }
    init();
  }
  async function doSignOut() { await sb.auth.signOut(); renderLogin(); }

  /* ---------- home ---------- */
  async function loadHomeCounts() {
    const out = [];
    for (const st of STATES) {
      const { count } = await sb.from('lf_places').select('id', { count: 'exact', head: true }).eq('region', st);
      out.push({ st, count: count || 0 });
    }
    S.homeCounts = out;
  }
  function renderHome() {
    const stats = (S.homeCounts || []).map(s =>
      `<div class="stat"><div class="st-num">${s.count}</div><div class="st-label">${s.st} jewellers</div></div>`).join('');
    $app.innerHTML = shell(`
      <div class="section-label">Search an area</div>
      <div class="lf-searchbar">
        <input id="lf-q" type="text" placeholder="City or area — e.g. Fort Lauderdale" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="lf-add" title="Add a jeweller" onclick="openAddLead()">＋</button>
      </div>
      <div class="lf-controls">${controlsHtml()}
        <button class="btn btn-primary btn-small" style="width:auto" onclick="doSearch()">Search</button>
      </div>
      <div class="lf-home-stats">${stats || ''}</div>
      <div class="empty"><div class="big">💎</div>Type a city to see the jewellers there.<br>Approve the good ones — they become your trip list.<br><br>Spotted a jeweller on Instagram or on the road? Tap ＋ to add it.</div>
      <div id="addlead-modal"></div>
    `);
  }

  function controlsHtml() {
    return `
        <select id="lf-state">
          <option value=""${S.state===''?' selected':''}>Any state</option>
          ${STATES.map(s=>`<option${S.state===s?' selected':''}>${s}</option>`).join('')}
        </select>
        <select id="lf-buf">
          <option value="0"${S.buf==='0'?' selected':''}>City only</option>
          <option value="10"${S.buf==='10'?' selected':''}>+10 km around</option>
          <option value="25"${S.buf==='25'?' selected':''}>+25 km around</option>
        </select>`;
  }

  /* ---------- search ---------- */
  async function geocode(q, state) {
    const query = q + (state ? ', ' + state : '') + ', USA';
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=' + encodeURIComponent(query);
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j.length) return null;
    return j[0]; // has boundingbox [s, n, w, e] and display_name
  }
  async function doSearch() {
    const q = document.getElementById('lf-q').value.trim();
    S.state = document.getElementById('lf-state') ? document.getElementById('lf-state').value : S.state;
    S.buf = document.getElementById('lf-buf') ? document.getElementById('lf-buf').value : S.buf;
    const state = S.state;
    const bufKm = parseFloat(S.buf) || 0;
    if (!q) { toast('Type a city or area name', 'err'); return; }
    toast('Searching…');
    let rows = null, label = q;
    try {
      const g = await geocode(q, state);
      if (g && g.boundingbox) {
        let s = parseFloat(g.boundingbox[0]), n = parseFloat(g.boundingbox[1]),
            w = parseFloat(g.boundingbox[2]), e = parseFloat(g.boundingbox[3]);
        const dLat = bufKm / 111;
        const midLat = (s + n) / 2;
        const dLon = bufKm / (111 * Math.max(0.3, Math.cos(midLat * Math.PI / 180)));
        s -= dLat; n += dLat; w -= dLon; e += dLon;
        let qy = sb.from('lf_places').select('*')
          .eq('hidden', false)
          .gte('latitude', s).lte('latitude', n)
          .gte('longitude', w).lte('longitude', e)
          .order('name').limit(1000);
        if (state) qy = qy.eq('region', state);
        const { data, error } = await qy;
        if (error) throw error;
        rows = data || [];
        label = (g.display_name || q).split(',').slice(0, 2).join(',');
      }
    } catch (e) { /* fall through to text search */ }
    if (rows === null || rows.length === 0) {
      const qq = q.replace(/[,()%.]/g, ' ').replace(/\s+/g, ' ').trim();
      let qy = sb.from('lf_places').select('*')
        .eq('hidden', false)
        .or(`city.ilike.%${qq}%,name.ilike.%${qq}%,address.ilike.%${qq}%`)
        .order('name').limit(1000);
      if (state) qy = qy.eq('region', state);
      const { data, error } = await qy;
      if (error) { toast(error.message, 'err'); return; }
      if (rows === null || (data && data.length > rows.length)) rows = data || [];
    }
    S.results = rows; S.areaLabel = label; S.view = 'list';
    S.filter = rows.some(r => r.approved == null) ? 'pending' : 'all';
    renderResults();
  }

  /* ---------- results ---------- */
  function filtered() {
    if (S.filter === 'all') return S.results;
    if (S.filter === 'research') return S.results.filter(p => p.research && statusOf(p) === 'pending');
    return S.results.filter(p => statusOf(p) === S.filter);
  }
  function chipCounts() {
    const c = { all: S.results.length, pending: 0, approved: 0, rejected: 0, research: 0 };
    for (const p of S.results) { c[statusOf(p)]++; if (p.research && statusOf(p) === 'pending') c.research++; }
    return c;
  }
  function card(p) {
    const st = statusOf(p);
    const chips = [
      st === 'pending' ? '<span class="chip chip-pending">To review</span>' :
      st === 'approved' ? '<span class="chip chip-approved">Approved ✓</span>' :
      '<span class="chip chip-rejected">Rejected</span>'
    ];
    if (p.verdict_reasons && p.verdict_reasons.length) chips.push(`<span class="chip chip-src">${esc(p.verdict_reasons[0].signal || '')}</span>`);
    if (p.locations_count && p.locations_count > 1) chips.push(`<span class="chip chip-src">🏢 ${p.locations_count} locations — main branch</span>`);
    if (p.segment === 'exchange') chips.push('<span class="chip chip-src">🏬 Multi-vendor exchange</span>');
    if (p.research && st === 'pending') chips.push('<span class="chip chip-pending">🔍 Research listed</span>');
    if (p.source && p.source !== 'osm') chips.push(`<span class="chip chip-src">${esc(p.source)}</span>`);
    const addr = [p.address, p.city, p.postcode].filter(Boolean).join(', ');
    const c = contactBtns(p);
    const actions = st === 'pending'
      ? `<div class="lf-actions">
           <button class="btn btn-small btn-approve" onclick="event.stopPropagation();approve('${p.id}')">✓ Approve</button>
           <button class="btn btn-small btn-reject" onclick="event.stopPropagation();openReject('${p.id}')">✗ Reject</button>
           <button class="btn btn-small btn-research" onclick="event.stopPropagation();markResearch('${p.id}')">${p.research ? '🔍 Listed ✓' : '🔍 Research'}</button>
         </div>`
      : `<button class="lf-reset" onclick="event.stopPropagation();resetVerdict('${p.id}')">Undo — back to review</button>`;
    return `<div class="lf-card" id="card-${p.id}" onclick="openDetail('${p.id}')">
      <div class="lf-name">${esc(p.name)}</div>
      ${addr ? `<div class="lf-addr">${esc(addr)}</div>` : ''}
      <div class="lf-chiprow">${chips.join('')}</div>
      <div class="lf-contacts">${c.join('')}</div>
      ${actions}
    </div>`;
  }
  function contactBtns(p, full) {
    const c = [];
    const sp = 'onclick="event.stopPropagation()"';
    if (p.phone) c.push(`<a class="lf-cbtn" ${sp} href="tel:${esc(digitsOnly(p.phone))}">📞 Call</a>`);
    const sms = smsLink(p.phone); if (sms) c.push(`<a class="lf-cbtn" ${sp} href="${esc(sms)}">💬 SMS</a>`);
    if (full) { const wa = waLink(p.phone); if (wa) c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="${esc(wa)}">🟢 WhatsApp</a>`); }
    if (p.email) c.push(`<a class="lf-cbtn" ${sp} href="mailto:${esc(p.email)}">✉️ Email</a>`);
    const wl = webLink(p.website); if (wl) c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="${esc(wl)}">🌐 Website</a>`);
    const ig = igLink(p.instagram); if (ig) c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="${esc(ig)}">📸 Instagram</a>`);
    const fb = fbLink(p.facebook); if (fb) c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="${esc(fb)}">📘 Facebook</a>`);
    c.push(`<a class="lf-cbtn" ${sp} target="_blank" rel="noopener" href="${esc(mapsLink(p))}">🗺️ Map</a>`);
    return c;
  }
  function openDetail(id) {
    const p = findP(id); if (!p) return;
    const st = statusOf(p);
    const chip = st === 'pending' ? '<span class="chip chip-pending">To review</span>'
      : st === 'approved' ? '<span class="chip chip-approved">Approved ✓</span>'
      : `<span class="chip chip-rejected">Rejected${p.verdict_reasons && p.verdict_reasons.length ? ' — ' + esc(p.verdict_reasons[0].signal || '') : ''}</span>`;
    const rows = [];
    const addRow = (k, v) => { if (v) rows.push(`<div class="detail-row"><div class="dk">${k}</div><div class="dv">${v}</div></div>`); };
    addRow('Address', esc([p.address, p.city, p.region, p.postcode].filter(Boolean).join(', ')));
    addRow('Phone', p.phone ? esc(p.phone) : null);
    addRow('Email', p.email ? esc(p.email) : null);
    addRow('Website', p.website ? esc(p.website) : null);
    addRow('Hours', p.opening_hours ? esc(p.opening_hours) : null);
    addRow('Segment', p.segment ? esc(p.segment) : null);
    addRow('Locations', p.locations_count && p.locations_count > 1 ? esc(p.locations_count + ' in this state — buying usually happens at the head office') : null);
    addRow('Source', p.source === 'osm' ? 'OpenStreetMap seed list' : esc(p.source));
    const summary = p.summary ? `<p style="margin:10px 0 0;font-size:14.5px">${esc(p.summary)}</p>` : '';
    const notes = p.notes ? `<p style="margin:8px 0 0;font-size:13.5px;color:var(--muted)">${esc(p.notes)}</p>` : '';
    const actions = st === 'pending'
      ? `<div class="lf-actions" style="margin-top:14px">
           <button class="btn btn-approve" onclick="approve('${p.id}')">✓ Approve</button>
           <button class="btn btn-reject" onclick="closeDetail();openReject('${p.id}')">✗ Reject</button>
         </div>
         <button class="btn btn-research" style="width:100%;margin-top:8px" onclick="closeDetail();markResearch('${p.id}')">${p.research ? '🔍 Listed for Claude research ✓ (tap to remove)' : '🔍 List for Claude deep research'}</button>`
      : `<button class="lf-reset" onclick="resetVerdict('${p.id}')">Undo — back to review</button>`;
    document.getElementById('detail-modal').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeDetail()">
        <div class="modal" style="max-height:86vh;overflow-y:auto">
          <h3 style="margin-bottom:2px">${esc(p.name)}</h3>
          <div class="lf-chiprow" style="margin:6px 0 10px">${chip}</div>
          ${rows.join('')}
          ${summary}${notes}
          <div class="lf-contacts" style="margin-top:14px">${contactBtns(p, true).join('')}</div>
          ${p.phone ? '<p style="margin:8px 0 0;font-size:12px;color:var(--muted)">WhatsApp opens only if that number is registered on WhatsApp — SMS always works.</p>' : ''}
          ${actions}
          <div class="modal-actions" style="margin-top:14px"><button class="btn btn-secondary" onclick="closeDetail()">Close</button></div>
        </div>
      </div>`;
  }
  function closeDetail() { const el = document.getElementById('detail-modal'); if (el) el.innerHTML = ''; }
  function renderResults() {
    const cc = chipCounts();
    const list = filtered();
    $app.innerHTML = shell(`
      <div class="lf-searchbar">
        <input id="lf-q" type="text" value="${esc(S.areaLabel)}" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="lf-add" title="Add a jeweller" onclick="openAddLead()">＋</button>
      </div>
      <div class="lf-controls">${controlsHtml()}
        <button class="btn btn-primary btn-small" style="width:auto" onclick="doSearch()">Search</button>
      </div>
      <div class="filter-chips">
        <button class="${S.filter==='all'?'on':''}" onclick="setFilter('all')">All ${cc.all}</button>
        <button class="${S.filter==='pending'?'on':''}" onclick="setFilter('pending')">To review ${cc.pending}</button>
        <button class="${S.filter==='approved'?'on':''}" onclick="setFilter('approved')">Approved ${cc.approved}</button>
        <button class="${S.filter==='research'?'on':''}" onclick="setFilter('research')">🔍 ${cc.research}</button>
        <button class="${S.filter==='rejected'?'on':''}" onclick="setFilter('rejected')">Rejected ${cc.rejected}</button>
      </div>
      <div class="lf-viewtabs">
        <button class="${S.view==='list'?'on':''}" onclick="setView('list')">List</button>
        <button class="${S.view==='map'?'on':''}" onclick="setView('map')">Map</button>
      </div>
      <div class="lf-count">${esc(S.areaLabel)} — ${cc.all} jewellers found</div>
      <div class="notice">⚠️ Seed list (OpenStreetMap) — this area hasn't been deep-scanned yet, so it's incomplete. Before working an area, ask Claude to <b>deep scan</b> it: missing stores get added, each one screened with evidence and pitch notes. Approve after the scan — except stores you already know.</div>
      <div id="lf-list" style="${S.view==='map'?'display:none':''}">
        ${list.length ? list.map(card).join('') : '<div class="empty"><div class="big">🔍</div>Nothing here for this filter.</div>'}
      </div>
      <div id="lf-map" style="${S.view==='map'?'display:block':''}"></div>
      <div id="reject-modal"></div>
      <div id="detail-modal"></div>
      <div id="addlead-modal"></div>
    `, { sub: S.areaLabel ? S.areaLabel.split(',')[0] : '' });
    if (S.view === 'map') mountMap();
  }
  function setFilter(f) { S.filter = f; renderResults(); }
  function setView(v) { S.view = v; renderResults(); }

  /* ---------- map ---------- */
  function mountMap() {
    const el = document.getElementById('lf-map');
    if (!el) return;
    el.style.display = 'block';
    S.map = L.map('lf-map');
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(S.map);
    const pts = [];
    for (const p of filtered()) {
      if (p.latitude == null || p.longitude == null) continue;
      const st = statusOf(p);
      const color = st === 'approved' ? '#1a7f4e' : st === 'rejected' ? '#b3372f' : '#7b1e3c';
      const m = L.circleMarker([p.latitude, p.longitude], { radius: 8, color, fillColor: color, fillOpacity: .85, weight: 1.5 }).addTo(S.map);
      m.bindPopup(`<b>${esc(p.name)}</b><br>${esc([p.address, p.city].filter(Boolean).join(', '))}<br><a href="#" onclick="jumpTo('${p.id}');return false;">Open card</a>`);
      pts.push([p.latitude, p.longitude]);
    }
    if (pts.length) S.map.fitBounds(pts, { padding: [30, 30] });
    setTimeout(() => S.map && S.map.invalidateSize(), 120);
  }
  function jumpTo(id) {
    S.view = 'list'; renderResults();
    const el = document.getElementById('card-' + id);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.outline = '2px solid var(--gold)'; setTimeout(() => el.style.outline = '', 1800); }
  }

  /* ---------- verdicts ---------- */
  function findP(id) { return S.results.find(x => x.id === id); }
  async function approve(id) {
    const p = findP(id); if (!p) return;
    const patch = { approved: true, verdict: p.verdict || 'fit', verdict_source: 'manual' };
    const { error } = await sb.from('lf_places').update(patch).eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    Object.assign(p, patch); toast('Approved ✓', 'ok'); renderResults();
  }
  function openReject(id) {
    S.rejectTarget = id;
    const p = findP(id); if (!p) return;
    document.getElementById('reject-modal').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeReject()">
        <div class="modal">
          <h3>Reject ${esc(p.name)}</h3>
          <p>Why is this store not a fit?</p>
          <div class="seg" style="margin-bottom:16px">
            ${REJECT_REASONS.map((r, i) => `<button onclick="doReject(${i})">${esc(r)}</button>`).join('')}
          </div>
          <div class="modal-actions"><button class="btn btn-secondary" onclick="closeReject()">Cancel</button></div>
        </div>
      </div>`;
  }
  function closeReject() { document.getElementById('reject-modal').innerHTML = ''; S.rejectTarget = null; }
  async function doReject(ri) {
    const reason = REJECT_REASONS[ri] || 'Other';
    const id = S.rejectTarget; const p = findP(id); if (!p) return;
    const patch = { approved: false, verdict: 'not_fit', verdict_source: 'manual', verdict_reasons: [{ signal: reason, src: 'manual' }] };
    const { error } = await sb.from('lf_places').update(patch).eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    Object.assign(p, patch); closeReject(); toast('Rejected', 'ok'); renderResults();
  }
  function openAddLead() {
    const el = document.getElementById('addlead-modal'); if (!el) return;
    el.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)closeAddLead()">
        <div class="modal">
          <h3>Add a jeweller</h3>
          <p class="sub" style="margin-bottom:10px">Spotted one on Instagram or on the road? Add it — Claude researches it on the next run.</p>
          <div class="field"><label>Store name *</label><input id="al-name" type="text"></div>
          <div class="field"><label>Instagram handle</label><input id="al-ig" type="text" placeholder="e.g. boca_treasures" autocapitalize="none"></div>
          <div class="field"><label>City</label><input id="al-city" type="text"></div>
          <div class="field"><label>State</label><select id="al-state">${STATES.map(s=>`<option${(S.state||'FL')===s?' selected':''}>${s}</option>`).join('')}</select></div>
          <div class="field"><label>Phone (optional)</label><input id="al-phone" type="tel"></div>
          <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeAddLead()">Cancel</button>
            <button class="btn btn-primary" onclick="saveLead()">Add 🔍</button>
          </div>
        </div>
      </div>`;
  }
  function closeAddLead() { const el = document.getElementById('addlead-modal'); if (el) el.innerHTML = ''; }
  async function saveLead() {
    const name = document.getElementById('al-name').value.trim();
    if (!name) { toast('Store name is needed', 'err'); return; }
    const ig = document.getElementById('al-ig').value.trim().replace(/^@/, '');
    const city = document.getElementById('al-city').value.trim();
    const region = document.getElementById('al-state').value;
    const phone = document.getElementById('al-phone').value.trim();
    const row = { source: 'manual', source_id: 'manual-' + Date.now(), name,
      instagram: ig || null, city: city || null, region, phone: phone || null, research: true };
    const { data, error } = await sb.from('lf_places').insert(row).select().single();
    if (error) { toast(error.message, 'err'); return; }
    closeAddLead(); toast('Added — flagged for Claude research 🔍', 'ok');
    if (S.areaLabel && Array.isArray(S.results)) { S.results.unshift(data); renderResults(); }
  }
  async function markResearch(id) {
    const p = findP(id); if (!p) return;
    const val = !p.research;
    const { error } = await sb.from('lf_places').update({ research: val }).eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    p.research = val;
    toast(val ? 'Listed for Claude deep research 🔍' : 'Removed from research list');
    renderResults();
  }
  async function resetVerdict(id) {
    const p = findP(id); if (!p) return;
    const patch = { approved: null, verdict: null, verdict_source: null, verdict_reasons: null };
    const { error } = await sb.from('lf_places').update(patch).eq('id', id);
    if (error) { toast(error.message, 'err'); return; }
    Object.assign(p, patch); toast('Back to review'); renderResults();
  }

  /* ---------- boot ---------- */
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { renderLogin(); return; }
    S.user = session.user;
    const { data: prof, error } = await sb.from('profiles').select('role, active').eq('id', S.user.id).single();
    if (error || !prof || prof.role !== 'owner' || !prof.active) {
      $app.innerHTML = `<div class="auth-wrap"><div class="auth-card" style="text-align:center">
        <h2>Owner only</h2><p class="sub">The Lead Finder is currently available only to the owner account.</p>
        <button class="btn btn-secondary" onclick="doSignOut()">Sign out</button></div></div>`;
      return;
    }
    await loadHomeCounts();
    renderHome();
  }
  window.doLogin = doLogin; window.doSignOut = doSignOut; window.doSearch = doSearch;
  window.setFilter = setFilter; window.setView = setView; window.approve = approve;
  window.openReject = openReject; window.closeReject = closeReject; window.doReject = doReject;
  window.resetVerdict = resetVerdict; window.jumpTo = jumpTo; window.markResearch = markResearch;
  window.openDetail = openDetail; window.closeDetail = closeDetail;
  window.openAddLead = openAddLead; window.closeAddLead = closeAddLead; window.saveLead = saveLead;
  init();
  </script>
</body>
</html>
